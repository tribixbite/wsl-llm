<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway's Game of Life</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: #e6edf3;
    letter-spacing: -0.02em;
  }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }

  button:hover { background: #30363d; border-color: #484f58; }
  button:active { background: #484f58; }
  button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }

  .speed-control {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 0.85rem;
  }

  .speed-control input[type="range"] {
    width: 120px;
    accent-color: #1f6feb;
  }

  .canvas-wrapper {
    position: relative;
    border: 1px solid #30363d;
    border-radius: 8px;
    overflow: hidden;
    background: #010409;
    margin-bottom: 12px;
  }

  canvas {
    display: block;
    cursor: crosshair;
  }

  .info-bar {
    display: flex;
    gap: 20px;
    font-size: 0.8rem;
    color: #8b949e;
    margin-bottom: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .info-bar span { white-space: nowrap; }

  .error-msg {
    color: #f85149;
    background: #f8514922;
    border: 1px solid #f8514944;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 0.85rem;
    margin-bottom: 12px;
    max-width: 600px;
    text-align: center;
    display: none;
  }

  .rle-display {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.75rem;
    color: #8b949e;
    max-width: 600px;
    word-break: break-all;
    text-align: center;
    margin-bottom: 10px;
    min-height: 1.2em;
  }

  .shortcuts {
    font-size: 0.75rem;
    color: #484f58;
    margin-top: 4px;
  }
</style>
</head>
<body>

<h1>Conway's Game of Life</h1>

<div class="controls">
  <button id="btnPlayPause">▶ Play</button>
  <button id="btnStep">⏭ Step</button>
  <button id="btnReset">↺ Reset</button>
  <button id="btnClear">✕ Clear</button>
</div>

<div class="speed-control">
  <label for="speedRange">Speed:</label>
  <input type="range" id="speedRange" min="1" max="60" value="10">
  <span id="speedValue">10 fps</span>
</div>

<div class="canvas-wrapper">
  <canvas id="gridCanvas"></canvas>
</div>

<div class="error-msg" id="errorMsg"></div>

<div class="rle-display" id="rleDisplay"></div>

<div class="info-bar">
  <span id="infoGen">Generation: 0</span>
  <span id="infoGrid">Grid: 0×0</span>
  <span id="infoPop">Population: 0</span>
</div>

<div class="shortcuts">Space: Play/Pause &nbsp;|&nbsp; S: Step &nbsp;|&nbsp; R: Reset &nbsp;|&nbsp; C: Clear</div>

<script>
(function() {
  'use strict';

  const canvas = document.getElementById('gridCanvas');
  const ctx = canvas.getContext('2d');
  const btnPlayPause = document.getElementById('btnPlayPause');
  const btnStep = document.getElementById('btnStep');
  const btnReset = document.getElementById('btnReset');
  const btnClear = document.getElementById('btnClear');
  const speedRange = document.getElementById('speedRange');
  const speedValue = document.getElementById('speedValue');
  const errorMsg = document.getElementById('errorMsg');
  const rleDisplay = document.getElementById('rleDisplay');
  const infoGen = document.getElementById('infoGen');
  const infoGrid = document.getElementById('infoGrid');
  const infoPop = document.getElementById('infoPop');

  const CELL_SIZE = 12;
  const GAP = 1;
  const CELL_TOTAL = CELL_SIZE + GAP;
  const COLOR_BG = '#010409';
  const COLOR_GRID = '#0d1117';
  const COLOR_CELL = '#58a6ff';
  const COLOR_CELL_GLOW = '#79c0ff';

  let grid = [];
  let cols = 0;
  let rows = 0;
  let generation = 0;
  let running = false;
  let initialRLE = '';
  let initialGrid = [];
  let initialCols = 0;
  let initialRows = 0;
  let animFrameId = null;
  let lastTickTime = 0;
  let fps = 10;

  // --- RLE Parsing ---

  function parseRLE(rleStr) {
    if (!rleStr || typeof rleStr !== 'string') {
      throw new Error('Empty RLE string');
    }

    rleStr = rleStr.trim();
    if (rleStr.length === 0) {
      throw new Error('Empty RLE string');
    }

    const parsedRows = [];
    let i = 0;
    const len = rleStr.length;

    while (i < len) {
      // Read a row
      const row = [];
      while (i < len && rleStr[i] !== '!') {
        // Read optional digit prefix
        let count = 0;
        const digitStart = i;
        while (i < len && rleStr[i] >= '0' && rleStr[i] <= '9') {
          count = count * 10 + (rleStr.charCodeAt(i) - 48);
          i++;
        }

        // If no digit was parsed, count is 1
        if (i === digitStart) {
          count = 1;
        }

        // Read the cell character
        if (i >= len) {
          throw new Error('Unexpected end of RLE: missing cell character after count ' + count);
        }

        const ch = rleStr[i];
        i++;

        if (ch !== 'o' && ch !== 'b') {
          throw new Error('Invalid cell character: "' + ch + '" at position ' + (i - 1) + ' (expected "o" or "b")');
        }

        const live = (ch === 'o');
        for (let j = 0; j < count; j++) {
          row.push(live);
        }
      }

      // Check for end-of-row marker
      if (i < len && rleStr[i] === '!') {
        i++; // skip '!'
      }

      parsedRows.push(row);
    }

    if (parsedRows.length === 0) {
      throw new Error('RLE did not produce any rows');
    }

    // Determine column count (max row width)
    let maxCols = 0;
    for (let r = 0; r < parsedRows.length; r++) {
      if (parsedRows[r].length > maxCols) {
        maxCols = parsedRows[r].length;
      }
    }

    // Pad shorter rows and build grid
    const resultRows = [];
    for (let r = 0; r < parsedRows.length; r++) {
      const row = parsedRows[r];
      const padded = new Array(maxCols).fill(false);
      for (let c = 0; c < row.length; c++) {
        padded[c] = row[c];
      }
      resultRows.push(padded);
    }

    return { grid: resultRows, rows: resultRows.length, cols: maxCols };
  }

  // --- Grid Operations ---

  function countPopulation(g) {
    let pop = 0;
    for (let r = 0; r < g.length; r++) {
      for (let c = 0; c < g[r].length; c++) {
        if (g[r][c]) pop++;
      }
    }
    return pop;
  }

  function nextGeneration(g, r, c) {
    const newGrid = [];
    for (let row = 0; row < r; row++) {
      newGrid.push(new Array(c).fill(false));
    }

    for (let y = 0; y < r; y++) {
      for (let x = 0; x < c; x++) {
        let neighbors = 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const ny = y + dy;
            const nx = x + dx;
            if (ny >= 0 && ny < r && nx >= 0 && nx < c) {
              if (g[ny][nx]) neighbors++;
            }
          }
        }
        if (g[y][x]) {
          newGrid[y][x] = (neighbors === 2 || neighbors === 3);
        } else {
          newGrid[y][x] = (neighbors === 3);
        }
      }
    }
    return newGrid;
  }

  function gridToRLE(g) {
    const r = g.length;
    const c = g[0].length;
    let parts = [];

    for (let row = 0; row < r; row++) {
      let seq = '';
      let runChar = -1;
      let runCount = 0;

      for (let col = 0; col < c; col++) {
        const isLive = g[row][col];
        const char = isLive ? 'o' : 'b';
        if (col === 0) {
          runChar = char.charCodeAt(0);
          runCount = 1;
        } else if (char.charCodeAt(0) === runChar) {
          runCount++;
        } else {
          seq += runCount + char;
          runChar = char.charCodeAt(0);
          runCount = 1;
        }
      }

      if (runCount > 0) {
        seq += runCount + char;
      }

      parts.push(seq);
    }

    return parts.join('!');
  }

  // --- Rendering ---

  function render() {
    const w = cols * CELL_TOTAL - GAP;
    const h = rows * CELL_TOTAL - GAP;

    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }

    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(0, 0, w, h);

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const px = x * CELL_TOTAL;
        const py = y * CELL_TOTAL;

        if (grid[y] && grid[y][x]) {
          // Cell glow
          ctx.fillStyle = COLOR_CELL_GLOW;
          ctx.fillRect(px + 1, py + 1, CELL_SIZE - 2, CELL_SIZE - 2);
          // Inner cell
          ctx.fillStyle = COLOR_CELL;
          ctx.fillRect(px + 2, py + 2, CELL_SIZE - 4, CELL_SIZE - 4);
        } else {
          // Dead cell background
          ctx.fillStyle = COLOR_GRID;
          ctx.fillRect(px + 1, py + 1, CELL_SIZE - 2, CELL_SIZE - 2);
        }
      }
    }
  }

  // --- URL / Hash Handling ---

  function updateHash() {
    const rle = gridToRLE(grid);
    // Use history.replaceState to avoid hashchange feedback loop
    const url = new URL(window.location.href);
    url.hash = rle;
    history.replaceState(null, '', url.toString());
  }

  function getHashRLE() {
    const hash = window.location.hash;
    if (hash.length > 0 && hash[0] === '#') {
      return hash.substring(1);
    }
    return '';
  }

  // --- Default Pattern (Glider) ---

  function getGliderRLE() {
    return 'o!2o!2o2o';
  }

  // --- Game Loop ---

  function tick() {
    const newGrid = nextGeneration(grid, rows, cols);
    grid = newGrid;
    generation++;

    updateHash();
    updateInfo();
    render();
  }

  function gameLoop(timestamp) {
    if (!running) return;

    const interval = 1000 / fps;
    if (timestamp - lastTickTime >= interval) {
      tick();
      lastTickTime = timestamp;
    }

    animFrameId = requestAnimationFrame(gameLoop);
  }

  function startGame() {
    if (running) return;
    running = true;
    btnPlayPause.textContent = '⏸ Pause';
    btnPlayPause.classList.add('active');
    lastTickTime = performance.now();
    animFrameId = requestAnimationFrame(gameLoop);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    btnPlayPause.textContent = '▶ Play';
    btnPlayPause.classList.remove('active');
    if (animFrameId) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
  }

  function togglePlay() {
    if (running) {
      stopGame();
    } else {
      startGame();
    }
  }

  function step() {
    if (running) stopGame();
    tick();
  }

  function resetToInitial() {
    if (running) stopGame();
    if (initialGrid && initialGrid.length > 0) {
      grid = initialGrid;
      cols = initialCols;
      rows = initialRows;
      generation = 0;
      updateHash();
      updateInfo();
      render();
    }
  }

  function clearGrid() {
    if (running) stopGame();
    const emptyGrid = [[false]];
    grid = emptyGrid;
    cols = 0;
    rows = 0;
    generation = 0;
    updateHash();
    updateInfo();
    render();
  }

  function loadFromHash() {
    const hashRLE = getHashRLE();
    const rle = hashRLE || getGliderRLE();

    initialRLE = rle;
    errorMsg.style.display = 'none';
    errorMsg.textContent = '';

    try {
      const result = parseRLE(rle);
      grid = result.grid;
      cols = result.cols;
      rows = result.rows;
      initialGrid = grid.map(row => [...row]);
      initialCols = cols;
      initialRows = rows;
      generation = 0;
      updateInfo();
      render();
      rleDisplay.textContent = 'RLE: ' + rle;
    } catch (e) {
      errorMsg.textContent = 'Error parsing RLE: ' + e.message;
      errorMsg.style.display = 'block';
      rleDisplay.textContent = 'RLE: ' + rle;
      grid = [[false]];
      cols = 0;
      rows = 0;
      initialGrid = [[false]];
      initialCols = 0;
      initialRows = 0;
      generation = 0;
      updateInfo();
      render();
    }
  }

  function updateInfo() {
    infoGen.textContent = 'Generation: ' + generation;
    infoGrid.textContent = 'Grid: ' + cols + '×' + rows;
    infoPop.textContent = 'Population: ' + countPopulation(grid);
  }

  // --- Click to Toggle ---

  canvas.addEventListener('click', function(e) {
    if (running) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    const cx = Math.floor(mx / CELL_TOTAL);
    const cy = Math.floor(my / CELL_TOTAL);

    if (cx >= 0 && cx < cols && cy >= 0 && cy < rows) {
      if (!grid[cy]) grid[cy] = [];
      grid[cy][cx] = !grid[cy][cx];
      updateHash();
      updateInfo();
      render();
    }
  });

  // --- Controls ---

  btnPlayPause.addEventListener('click', togglePlay);
  btnStep.addEventListener('click', step);
  btnReset.addEventListener('click', resetToInitial);
  btnClear.addEventListener('click', clearGrid);

  speedRange.addEventListener('input', function() {
    fps = parseInt(speedRange.value, 10);
    speedValue.textContent = fps + ' fps';
  });

  // --- Keyboard Shortcuts ---

  document.addEventListener('keydown', function(e) {
    // Ignore if user is typing in an input
    if (e.target.tagName === 'INPUT') return;

    switch (e.key.toLowerCase()) {
      case ' ':
        e.preventDefault();
        togglePlay();
        break;
      case 's':
        e.preventDefault();
        step();
        break;
      case 'r':
        e.preventDefault();
        resetToInitial();
        break;
      case 'c':
        e.preventDefault();
        clearGrid();
        break;
    }
  });

  // --- Init ---

  loadFromHash();

})();
</script>

</body>
</html>
