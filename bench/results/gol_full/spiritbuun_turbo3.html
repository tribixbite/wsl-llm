<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway's Game of Life</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}
h1{font-size:1.6rem;margin-bottom:12px;color:#58a6ff;letter-spacing:-0.5px}
#toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;transition:background .15s,border-color .15s;white-space:nowrap}
button:hover{background:#30363d;border-color:#8b949e}
button:active{background:#484f58}
button.active{background:#1f6feb;border-color:#1f6feb}
#info{font-size:12px;color:#8b949e;margin-bottom:8px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
#info span{display:inline-flex;align-items:center;gap:4px}
kbd{background:#161b22;border:1px solid #30363d;border-radius:3px;padding:1px 5px;font-size:11px;font-family:inherit;color:#8b949e}
canvas{border:1px solid #30363d;border-radius:4px;cursor:crosshair;display:block;background:#010409}
#status{margin-top:8px;font-size:12px;min-height:18px;text-align:center}
#error{color:#f85149;font-size:12px;margin-top:8px;text-align:center;max-width:600px;line-height:1.5}
#urlBar{margin-top:8px;display:flex;align-items:center;gap:6px;width:100%;max-width:700px}
#urlBar input{flex:1;background:#161b22;border:1px solid #30363d;color:#c9d1d9;padding:6px 10px;border-radius:6px;font-size:12px;font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;outline:none}
#urlBar input:focus{border-color:#58a6ff}
#urlBar button{padding:6px 12px;font-size:12px}
</style>
</head>
<body>
<h1>Conway's Game of Life</h1>
<div id="toolbar">
<button id="btnToggle">▶ Start</button>
<button id="btnStep">⏭ Step</button>
<button id="btnReset">↺ Reset</button>
<button id="btnClear">✕ Clear</button>
</div>
<div id="info">
<span>Pop: <strong id="popCount">0</strong></span>
<span>Tick: <strong id="tickCount">0</strong></span>
<span>Grid: <strong id="gridSize">0×0</strong></span>
</div>
<canvas id="canvas"></canvas>
<div id="status">Ready</div>
<div id="error"></div>
<div id="urlBar">
<input id="urlInput" type="text" placeholder="RLE string or press Reset to restore initial state">
<button id="btnLoad">Load</button>
</div>
<script>
(function(){
"use strict";

/* ── Constants ── */
const CELL=10, GAP=1, BG='#010409', BG_ALT='#0a0f17', FILL='#3fb950', FILL_ALT='#2ea043';

/* ── DOM refs ── */
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const $toggle=document.getElementById('btnToggle');
const $step=document.getElementById('btnStep');
const $reset=document.getElementById('btnReset');
const $clear=document.getElementById('btnClear');
const $pop=document.getElementById('popCount');
const $tick=document.getElementById('tickCount');
const $grid=document.getElementById('gridSize');
const $status=document.getElementById('status');
const $error=document.getElementById('error');
const $urlInput=document.getElementById('urlInput');
const $btnLoad=document.getElementById('btnLoad');

/* ── State ── */
let grid=null, rows=0, cols=0;
let running=false, animId=null;
let initHash='', tickNum=0, errorText='';
let cellOn=false; // for click toggle

/* ── Helpers ── */
function status(msg){$status.textContent=msg}
function showError(msg){errorText=msg;$error.textContent=msg}
function clearError(){$error.textContent='';errorText=''}

function countOnes(g){let n=0;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(g[r][c])n++;return n}

function updateInfo(){
    $pop.textContent=countOnes(grid);
    $tick.textContent=tickNum;
    $grid.textContent=cols+'×'+rows;
}

/* ── RLE Parsing ── */
function parseRLE(rle){
    rle=rle.replace(/\s+/g,'');
    if(!rle) return null;
    const rowsArr=[];
    let i=0;
    while(i<rle.length){
        const row=[];
        while(i<rle.length && rle[i]!=='!'){
            if(rle[i]==='o'||rle[i]==='b'){
                row.push(rle[i]==='o');
                i++;
            } else if(rle[i]>='1'&&rle[i]<='9'){
                let num=0;
                while(i<rle.length&&rle[i]>='0'&&rle[i]<='9'){num=num*10+parseInt(rle[i],10);i++}
                if(i>=rle.length) throw new Error('RLE: digit '+num+' not followed by cell type (o/b)');
                if(rle[i]==='o'||rle[i]==='b'){
                    for(let k=0;k<num;k++) row.push(rle[i]==='o');
                    i++;
                } else {
                    throw new Error('RLE: invalid cell type "'+rle[i]+'" after count '+num);
                }
            } else {
                throw new Error('RLE: unexpected character "'+rle[i]+'" at position '+i);
            }
        }
        if(row.length>0) rowsArr.push(row);
        if(i<rle.length && rle[i]==='!') i++; // skip '!'
    }
    if(rowsArr.length===0) return null;
    cols=Math.max(...rowsArr.map(r=>r.length));
    for(let r=0;r<rowsArr.length;r++) while(rowsArr[r].length<cols) rowsArr[r].push(false);
    return rowsArr;
}

/* ── Grid Operations ── */
function cloneGrid(g){return g.map(r=>Array.from(r))}

function step(g){
    const out=Array.from({length:rows},()=>Array(cols).fill(false));
    for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
            let n=0;
            for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
                if(!dr&&!dc) continue;
                const nr=r+dr, nc=c+dc;
                if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&g[nr][nc]) n++;
            }
            if(g[r][c]) out[r][c]=(n===2||n===3);
            else out[r][c]=(n===3);
        }
    }
    return out;
}

/* ── Rendering ── */
function render(){
    const cw=cols*(CELL+GAP)+GAP;
    const ch=rows*(CELL+GAP)+GAP;
    if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch}
    ctx.fillStyle=BG;
    ctx.fillRect(0,0,cw,ch);
    for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
            const x=c*(CELL+GAP)+GAP, y=r*(CELL+GAP)+GAP;
            ctx.fillStyle=(grid[r][c])?FILL:BG_ALT;
            ctx.fillRect(x,y,CELL,CELL);
        }
    }
}

/* ── URL / Hash ── */
function gridToRLE(g){
    let s='';
    for(let r=0;r<rows;r++){
        let run=0, prev=-1;
        for(let c=0;c<cols;c++){
            const cur=g[r][c]?1:0;
            if(cur===prev){run++}
            else{
                if(prev===1) s+=run+'o';
                else if(prev===0) s+=run+'b';
                prev=cur;run=1;
            }
        }
        if(prev===1) s+=run+'o';
        else if(prev===0) s+=run+'b';
        s+='!';
    }
    return s;
}

function loadFromHash(){
    const h=location.hash.slice(1);
    if(!h){
        grid=parseRLE('o2o!2b2o!o2o!obo!2o!2b'); // glider 7x6
        initHash=gridToRLE(grid);
        tickNum=0;
        clearError();
        return;
    }
    try{
        const p=parseRLE(h);
        if(!p) throw new Error('Empty grid');
        grid=p;
        rows=p.length;
        cols=p[0].length;
        initHash=h;
        tickNum=0;
        clearError();
    }catch(e){
        showError('Malformed RLE: '+e.message);
        grid=null;
        rows=0;cols=0;
    }
}

function updateHash(){
    if(!grid){return}
    const rle=gridToRLE(grid);
    if(rle===initHash) location.hash='';
    else location.hash=rle;
}

/* ── Controls ── */
function toggleRun(){
    running=!running;
    $toggle.textContent=running?'⏸ Pause':'▶ Start';
    $toggle.classList.toggle('active',running);
    if(running) animLoop();
    else if(animId){cancelAnimationFrame(animId);animId=null}
    status(running?'Running':'Paused');
}

function stepTick(){
    if(!grid) return;
    grid=step(grid);
    tickNum++;
    updateHash();
    render();
    updateInfo();
    status('Stepped → tick '+tickNum);
}

function resetToInit(){
    stop();
    loadFromHash();
    if(grid){render();updateInfo();status('Reset to initial state')}
}

function clearGrid(){
    stop();
    if(!grid||cols===0) return;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) grid[r][c]=false;
    tickNum=0;
    updateHash();
    render();
    updateInfo();
    status('Cleared');
}

function stop(){
    running=false;
    $toggle.textContent='▶ Start';
    $toggle.classList.remove('active');
    if(animId){cancelAnimationFrame(animId);animId=null}
}

function loadFromInput(){
    const val=$urlInput.value.trim();
    if(!val){resetToInit();return}
    stop();
    const h=val;
    location.hash=h;
    loadFromHash();
    if(grid){render();updateInfo();status('Loaded RLE → tick 0')}
}

/* ── Animation Loop ── */
let lastTime=0;
const TICK_INTERVAL=150;
function animLoop(timestamp){
    if(!running) return;
    if(!lastTime) lastTime=timestamp;
    if(timestamp-lastTime>=TICK_INTERVAL){
        grid=step(grid);
        tickNum++;
        updateHash();
        render();
        updateInfo();
        lastTime=timestamp;
    }
    animId=requestAnimationFrame(animLoop);
}

/* ── Click Handling ── */
canvas.addEventListener('click',function(e){
    if(!grid||running) return;
    const rect=canvas.getBoundingClientRect();
    const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    const c=Math.floor((mx-GAP)/(CELL+GAP));
    const r=Math.floor((my-GAP)/(CELL+GAP));
    if(r<0||r>=rows||c<0||c>=cols) return;
    grid[r][c]=!grid[r][c];
    updateHash();
    render();
    updateInfo();
});

/* ── Keyboard ── */
document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT') return;
    switch(e.key.toLowerCase()){
        case ' ':e.preventDefault();toggleRun();break;
        case 's':e.preventDefault();stepTick();break;
        case 'r':e.preventDefault();resetToInit();break;
        case 'c':e.preventDefault();clearGrid();break;
    }
});

/* ── Hash change (from external input or manual edit) ── */
window.addEventListener('hashchange',function(){
    if(location.hash!==initHash){
        stop();
        loadFromHash();
        if(grid){render();updateInfo();status('Hash changed → tick '+tickNum)}
    }
});

/* ── Init ── */
$btnLoad.addEventListener('click',loadFromInput);
$urlInput.addEventListener('keydown',function(e){if(e.key==='Enter')loadFromInput()});

$toggle.addEventListener('click',toggleRun);
$step.addEventListener('click',stepTick);
$reset.addEventListener('click',resetToInit);
$clear.addEventListener('click',clearGrid);

loadFromHash();
render();
updateInfo();
if(errorText) status('Error loaded'); else status('Ready — press Space to start');

})();
</script>
</body>
</html>
