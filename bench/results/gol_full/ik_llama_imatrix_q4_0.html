<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway's Game of Life</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;color:#c8c8d0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}
  h1{font-size:1.6rem;font-weight:600;margin-bottom:12px;color:#e0e0e8;letter-spacing:-0.5px}
  #controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
  button{background:#1e1e2e;color:#c8c8d0;border:1px solid #333348;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:0.85rem;font-family:inherit;transition:background .15s,border-color .15s}
  button:hover{background:#2a2a40;border-color:#555578}
  button:active{background:#333355}
  button.active{background:#2a4a2a;border-color:#4a8;color:#a0d0a0}
  #info{margin-bottom:10px;font-size:0.8rem;color:#777790;text-align:center;min-height:1.2em}
  #canvas-wrap{position:relative;border:1px solid #222238;border-radius:4px;overflow:hidden;background:#0d0d14;box-shadow:0 0 30px rgba(0,0,0,0.5)}
  canvas{display:block;cursor:crosshair}
  #error{color:#ff6b6b;margin-top:10px;font-size:0.85rem;text-align:center;max-width:700px;min-height:1.2em}
  #error a{color:#ff8888;text-decoration:underline}
  #stats{margin-top:8px;font-size:0.75rem;color:#555568}
</style>
</head>
<body>
<h1>Conway's Game of Life</h1>
<div id="controls">
  <button id="btnStart" title="Space">▶ Start</button>
  <button id="btnStep" title="S">⏭ Step</button>
  <button id="btnReset" title="R">↺ Reset</button>
  <button id="btnClear" title="C">✕ Clear</button>
</div>
<div id="info"></div>
<div id="canvas-wrap"><canvas id="canvas"></canvas></div>
<div id="error"></div>
<div id="stats"></div>

<script>
(function(){
"use strict";

/* ── Constants ─────────────────────────────────────────────── */
const CELL = 10;
const BG   = '#0d0d14';
const DEAD = '#141420';
const LIVE = '#4ae68a';
const LIVE_GLOW = '#2acc60';
const GRID_CLR = '#1a1a28';

const DEFAULT_RLE = '3o$2bo$bo!';   // Glider

/* ── DOM refs ──────────────────────────────────────────────── */
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const elInfo   = document.getElementById('info');
const elError  = document.getElementById('error');
const elStats  = document.getElementById('stats');
const btnStart = document.getElementById('btnStart');
const btnStep  = document.getElementById('btnStep');
const btnReset = document.getElementById('btnReset');
const btnClear = document.getElementById('btnClear');

/* ── State ─────────────────────────────────────────────────── */
let grid       = null;
let rows       = 0;
let cols       = 0;
let initial    = null;
let generation = 0;
let running    = false;
let timer      = null;
let errorText  = '';
let initialHash = '';

/* ── RLE Parser ────────────────────────────────────────────── */
function parseRLE(rle){
  rle = rle.trim();
  if(!rle) return null;

  const rawRows = rle.split('!');
  const result  = [];

  for(let i = 0; i < rawRows.length; i++){
    const seg = rawRows[i];
    if(seg.length === 0){
      result.push([]);
      continue;
    }
    const cells = [];
    let j = 0;
    while(j < seg.length){
      let count = 0;
      while(j < seg.length && seg[j] >= '0' && seg[j] <= '9'){
        count = count * 10 + (seg.charCodeAt(j) - 48);
        j++;
      }
      if(count === 0) count = 1;
      if(j >= seg.length) throw new Error('RLE ends unexpectedly — expected cell character after number.');
      const ch = seg[j]; j++;
      if(ch !== 'o' && ch !== 'b') throw new Error('Invalid RLE character "' + ch + '" — expected "o" (live) or "b" (dead).');
      for(let k = 0; k < count; k++) cells.push(ch === 'o' ? 1 : 0);
    }
    result.push(cells);
  }

  if(result.length === 0) return null;

  // Pad rows to equal width
  let maxW = 0;
  for(let i = 0; i < result.length; i++){
    if(result[i].length > maxW) maxW = result[i].length;
  }
  for(let i = 0; i < result.length; i++){
    while(result[i].length < maxW) result[i].push(0);
  }

  return { grid: result, rows: result.length, cols: maxW };
}

/* ── Grid helpers ──────────────────────────────────────────── */
function makeGrid(r, c, fill){
  const g = new Array(r);
  for(let i = 0; i < r; i++){
    g[i] = new Uint8Array(c);
    if(fill !== undefined) g[i].fill(fill);
  }
  return g;
}

function copyGrid(g){
  const r = g.length;
  const c = g[0].length;
  const ng = makeGrid(r, c);
  for(let i = 0; i < r; i++) ng[i].set(g[i]);
  return ng;
}

function countLive(g){
  let n = 0;
  for(let i = 0; i < g.length; i++)
    for(let j = 0; j < g[i].length; j++)
      if(g[i][j]) n++;
  return n;
}

/* ── Game of Life tick ─────────────────────────────────────── */
function tick(g){
  const r = g.length, c = g[0].length;
  const ng = makeGrid(r, c);
  for(let i = 0; i < r; i++){
    for(let j = 0; j < c; j++){
      let s = 0;
      for(let di = -1; di <= 1; di++){
        const ni = i + di;
        if(ni < 0 || ni >= r) continue;
        const nr = g[ni];
        s += nr[(j - 1 + c) % c];
        s += nr[(j + 1)       % c];
      }
      s += g[(i - 1 + r) % r][j] + g[(i + 1) % r][j];
      if(g[i][j]){
        ng[i][j] = (s === 2 || s === 3) ? 1 : 0;
      } else {
        ng[i][j] = (s === 3) ? 1 : 0;
      }
    }
  }
  return ng;
}

/* ── Rendering ─────────────────────────────────────────────── */
function render(){
  const w = cols * CELL, h = rows * CELL;
  canvas.width  = w;
  canvas.height = h;

  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, w, h);

  if(!grid) return;

  // Grid lines
  ctx.strokeStyle = GRID_CLR;
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  for(let i = 0; i <= rows; i++){
    ctx.moveTo(0, i * CELL + 0.5);
    ctx.lineTo(w, i * CELL + 0.5);
  }
  for(let j = 0; j <= cols; j++){
    ctx.moveTo(j * CELL + 0.5, 0);
    ctx.lineTo(j * CELL + 0.5, h);
  }
  ctx.stroke();

  // Live cells
  ctx.fillStyle = LIVE;
  const pad = 1;
  for(let i = 0; i < rows; i++){
    for(let j = 0; j < cols; j++){
      if(grid[i][j]){
        ctx.fillRect(j * CELL + pad, i * CELL + pad, CELL - pad * 2, CELL - pad * 2);
      }
    }
  }
}

/* ── UI helpers ────────────────────────────────────────────── */
function setInfo(){
  elInfo.textContent = rows > 0
    ? rows + '×' + cols + '  ·  ' + countLive(grid) + ' live cells  ·  Gen ' + generation
    : 'Empty grid';
}

function setError(msg){
  elError.innerHTML = msg || '';
  errorText = msg || '';
}

function setStats(){
  elStats.textContent = 'Hash: ' + (initialHash ? '#' + initialHash.substring(0, 60) + (initialHash.length > 60 ? '…' : '') : '(none)');
}

function updateStartButton(){
  if(running){
    btnStart.textContent = '⏸ Pause';
    btnStart.classList.add('active');
  } else {
    btnStart.textContent = '▶ Start';
    btnStart.classList.remove('active');
  }
}

/* ── URL management ────────────────────────────────────────── */
function getHash(){
  return location.hash.length > 1 ? location.hash.substring(1) : '';
}

function setURLState(rle){
  if(rle){
    history.replaceState(null, '', '#' + rle);
  } else {
    history.replaceState(null, '', location.pathname + location.search);
  }
}

function currentRLE(){
  if(!grid || rows === 0 || cols === 0) return '';
  const segs = [];
  for(let i = 0; i < rows; i++){
    let count = 0;
    let cur = grid[i][0];
    let s = '';
    for(let j = 0; j < cols; j++){
      if(grid[i][j] === cur){
        count++;
      } else {
        if(count > 1) s += count;
        s += cur === 1 ? 'o' : 'b';
        cur = grid[i][j];
        count = 1;
      }
    }
    if(count > 1) s += count;
    s += cur === 1 ? 'o' : 'b';
    segs.push(s);
  }
  return segs.join('!');
}

/* ── Core logic ────────────────────────────────────────────── */
function loadFromHash(){
  const hash = getHash();
  if(!hash){
    initialHash = DEFAULT_RLE;
    setError('');
  } else {
    initialHash = hash;
    setError('');
  }

  try {
    const parsed = parseRLE(initialHash);
    if(!parsed) throw new Error('Empty grid — provide a valid RLE string or leave the hash empty for a default glider.');
    grid       = parsed.grid;
    rows       = parsed.rows;
    cols       = parsed.cols;
    initial    = copyGrid(grid);
    generation = 0;
    errorText  = '';
    setError('');
  } catch(e){
    grid     = null;
    rows     = 0;
    cols     = 0;
    initial  = null;
    generation = 0;
    errorText = e.message;
    setError('<b>Error:</b> ' + escapeHTML(e.message) + '<br><small>Try <a href="#" onclick="resetToDefault()">resetting</a> to restore the default pattern.</small>');
  }

  render();
  setInfo();
  setStats();
  updateStartButton();
}

function escapeHTML(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function tickOnce(){
  if(!grid || rows === 0) return;
  grid = tick(grid);
  generation++;
  setURLState(currentRLE());
  render();
  setInfo();
}

function startLoop(){
  stopLoop();
  running = true;
  updateStartButton();
  timer = setInterval(tickOnce, 120);
}

function stopLoop(){
  running = false;
  if(timer){ clearInterval(timer); timer = null; }
  updateStartButton();
}

function toggleRun(){
  if(running) stopLoop(); else startLoop();
}

function resetToDefault(){
  stopLoop();
  initialHash = DEFAULT_RLE;
  setURLState(DEFAULT_RLE);
  loadFromHash();
}

function resetToInitial(){
  stopLoop();
  if(!initial){ loadFromHash(); return; }
  grid = copyGrid(initial);
  generation = 0;
  setURLState(currentRLE());
  render();
  setInfo();
}

function clearGrid(){
  stopLoop();
  grid = null; rows = 0; cols = 0;
  initial = null; generation = 0;
  setURLState('');
  render();
  setInfo();
  setStats();
  setError('');
}

/* ── Canvas click handling ─────────────────────────────────── */
canvas.addEventListener('click', function(ev){
  if(running) return;
  if(errorText) return;
  if(!grid) return;

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const cx = Math.floor((ev.clientX - rect.left) * scaleX / CELL);
  const cy = Math.floor((ev.clientY - rect.top)  * scaleY / CELL);

  if(cx < 0 || cx >= cols || cy < 0 || cy >= rows) return;

  grid[cy][cx] = grid[cy][cx] ? 0 : 1;
  setURLState(currentRLE());
  render();
  setInfo();
});

/* ── Keyboard shortcuts ────────────────────────────────────── */
document.addEventListener('keydown', function(ev){
  if(ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA') return;
  switch(ev.key.toLowerCase()){
    case ' ': ev.preventDefault(); toggleRun(); break;
    case 's': ev.preventDefault(); tickOnce(); break;
    case 'r': ev.preventDefault(); resetToInitial(); break;
    case 'c': ev.preventDefault(); clearGrid(); break;
  }
});

/* ── Button bindings ───────────────────────────────────────── */
btnStart.addEventListener('click', toggleRun);
btnStep.addEventListener('click', tickOnce);
btnReset.addEventListener('click', resetToInitial);
btnClear.addEventListener('click', clearGrid);

/* ── Init ──────────────────────────────────────────────────── */
loadFromHash();

})();
</script>
</body>
</html>
