<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway's Game of Life — RLE</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0e17;
  color: #c8d6e5;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  user-select: none;
}

h1 {
  font-size: 1.3rem;
  font-weight: 600;
  color: #74b9ff;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

#controls {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  background: #1e2a3a;
  color: #dfe6e9;
  border: 1px solid #2d3a4a;
  padding: 8px 18px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 500;
  transition: background 0.15s, border-color 0.15s;
  letter-spacing: 0.3px;
}
button:hover { background: #2d3a4a; border-color: #4a6fa5; }
button:active { background: #3d4a5a; }
button.active { background: #1a3a5c; border-color: #74b9ff; color: #74b9ff; }

#info {
  display: flex;
  gap: 20px;
  font-size: 0.8rem;
  color: #636e7b;
  margin-bottom: 10px;
  flex-wrap: wrap;
  justify-content: center;
}
#info span { white-space: nowrap; }
#info .val { color: #a4b0be; font-weight: 600; }

#canvas-wrap {
  border: 1px solid #1e2a3a;
  border-radius: 6px;
  overflow: hidden;
  background: #060a12;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  position: relative;
}

canvas {
  display: block;
  cursor: crosshair;
}

#rle-display {
  margin-top: 12px;
  width: 100%;
  max-width: 700px;
}

#rle-display label {
  font-size: 0.75rem;
  color: #636e7b;
  display: block;
  margin-bottom: 4px;
}

#rle-output {
  width: 100%;
  background: #0d1520;
  color: #55efc4;
  border: 1px solid #1e2a3a;
  border-radius: 6px;
  padding: 8px 10px;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 0.8rem;
  resize: none;
  height: 36px;
  line-height: 1.4;
  letter-spacing: 0.5px;
}
#rle-output:focus { outline: none; border-color: #74b9ff; }

#error {
  color: #ff7675;
  font-size: 0.8rem;
  margin-top: 6px;
  min-height: 1.2em;
  text-align: center;
}

#shortcuts {
  margin-top: 14px;
  font-size: 0.7rem;
  color: #3d4a5a;
  text-align: center;
  line-height: 1.8;
}
kbd {
  background: #1e2a3a;
  border: 1px solid #2d3a4a;
  border-radius: 3px;
  padding: 1px 6px;
  font-family: inherit;
  font-size: 0.7rem;
  color: #a4b0be;
}
</style>
</head>
<body>

<h1>Conway's Game of Life</h1>

<div id="controls">
  <button id="btn-play" title="Play / Pause">▶ Play</button>
  <button id="btn-step" title="Step one generation">⏭ Step</button>
  <button id="btn-reset" title="Reset to initial state">↺ Reset</button>
  <button id="btn-clear" title="Clear grid">✕ Clear</button>
</div>

<div id="info">
  <span>Generation: <span class="val" id="gen-count">0</span></span>
  <span>Population: <span class="val" id="pop-count">0</span></span>
  <span>Grid: <span class="val" id="grid-size">—</span></span>
</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<div id="error"></div>

<div id="rle-display">
  <label for="rle-output">RLE (current state — copy URL to share):</label>
  <textarea id="rle-output" readonly></textarea>
</div>

<div id="shortcuts">
  <kbd>Space</kbd> Play/Pause &nbsp;
  <kbd>S</kbd> Step &nbsp;
  <kbd>R</kbd> Reset &nbsp;
  <kbd>C</kbd> Clear &nbsp;
  Click canvas to toggle cells
</div>

<script>
(function() {
  'use strict';

  // ─── Constants ────────────────────────────────────────────────
  const CELL_SIZE = 14;
  const GRID_BG   = '#060a12';
  const CELL_BG   = '#74b9ff';
  const GRID_LINE = '#0c1220';
  const DEAD_COLOR = '#0e1525';

  const DEFAULT_RLE = '3o$2b2o!'; // glider

  // ─── DOM refs ─────────────────────────────────────────────────
  const canvas       = document.getElementById('canvas');
  const ctx          = canvas.getContext('2d');
  const btnPlay      = document.getElementById('btn-play');
  const btnStep      = document.getElementById('btn-step');
  const btnReset     = document.getElementById('btn-reset');
  const btnClear     = document.getElementById('btn-clear');
  const genCountEl   = document.getElementById('gen-count');
  const popCountEl   = document.getElementById('pop-count');
  const gridSizeEl   = document.getElementById('grid-size');
  const rleOutput    = document.getElementById('rle-output');
  const errorEl      = document.getElementById('error');

  // ─── State ────────────────────────────────────────────────────
  let initialGrid = null;
  let currentGrid = null;
  let rows = 0;
  let cols = 0;
  let generation = 0;
  let running = false;
  let animId = null;
  let tickInterval = 180;
  let lastTickTime = 0;
  let initialRLE = '';

  // ─── RLE Parsing ──────────────────────────────────────────────

  function parseRLE(rleStr) {
    rleStr = rleStr.trim();
    if (!rleStr) return null;

    // Validate: must end with !
    if (rleStr[rleStr.length - 1] !== '!') {
      throw new Error('RLE must end with "!"');
    }

    const rowsArr = rleStr.split('!');
    const grids = [];

    for (let r = 0; r < rowsArr.length; r++) {
      const rowStr = rowsArr[r];
      const cells = parseRow(rowStr);
      if (cells === null) {
        throw new Error(`Row ${r + 1}: invalid RLE content "${rowStr}"`);
      }
      grids.push(cells);
    }

    // Determine grid dimensions
    const r = grids.length;
    const c = Math.max(...grids.map(row => row.length));

    // Normalize to rectangular grid
    const grid = [];
    for (let i = 0; i < r; i++) {
      const row = grids[i];
      const normalized = new Array(c).fill(0);
      for (let j = 0; j < row.length; j++) {
        normalized[j] = row[j];
      }
      grid.push(normalized);
    }

    return { grid, rows: r, cols: c };
  }

  function parseRow(rowStr) {
    rowStr = rowStr.trim();
    if (rowStr === '') return [];

    const cells = [];
    let i = 0;
    const len = rowStr.length;

    while (i < len) {
      // Parse optional run-length digit(s)
      let runLength = 1;
      const start = i;
      while (i < len && rowStr[i] >= '0' && rowStr[i] <= '9') {
        i++;
      }
      if (i > start) {
        runLength = parseInt(rowStr.substring(start, i), 10);
      }

      if (i >= len) {
        throw new Error(`Unexpected end of row string: "${rowStr.substring(start)}"`);
      }

      const type = rowStr[i];
      i++;

      if (type === 'o') {
        for (let j = 0; j < runLength; j++) cells.push(1);
      } else if (type === 'b') {
        for (let j = 0; j < runLength; j++) cells.push(0);
      } else {
        throw new Error(`Unknown character "${type}" at position ${i - 1} in "${rowStr}"`);
      }
    }

    return cells;
  }

  // ─── RLE Encoding ─────────────────────────────────────────────

  function encodeRLE(grid) {
    const r = grid.length;
    if (r === 0) return '';

    const rowStrings = [];

    for (let i = 0; i < r; i++) {
      const row = grid[i];
      const cells = [];
      let j = 0;
      const len = row.length;

      while (j < len) {
        const val = row[j];
        let count = 1;
        while (j + count < len && row[j + count] === val) {
          count++;
        }
        cells.push({ val, count });
        j += count;
      }

      rowStrings.push(compressCells(cells));
    }

    return rowStrings.join('!') + '!';
  }

  function compressCells(cells) {
    if (cells.length === 0) return '';

    let result = '';
    let i = 0;
    const len = cells.length;

    while (i < len) {
      // Merge consecutive runs of the same value
      let val = cells[i].val;
      let count = cells[i].count;
      let j = i + 1;

      while (j < len && cells[j].val === val) {
        count += cells[j].count;
        j++;
      }

      if (val === 1) {
        if (count === 1) {
          result += 'o';
        } else {
          result += count + 'o';
        }
      } else {
        if (count === 1) {
          result += 'b';
        } else {
          result += count + 'b';
        }
      }

      i = j;
    }

    return result;
  }

  // ─── Grid Operations ──────────────────────────────────────────

  function copyGrid(grid) {
    return grid.map(row => new Int8Array(row));
  }

  function nextGeneration(grid, r, c) {
    const next = [];
    for (let i = 0; i < r; i++) {
      next.push(new Int8Array(c));
    }

    for (let i = 0; i < r; i++) {
      for (let j = 0; j < c; j++) {
        let neighbors = 0;
        for (let di = -1; di <= 1; di++) {
          for (let dj = -1; dj <= 1; dj++) {
            if (di === 0 && dj === 0) continue;
            const ni = (i + di + r) % r;
            const nj = (j + dj + c) % c;
            neighbors += grid[ni][nj];
          }
        }
        const alive = grid[i][j];
        next[i][j] = (alive && (neighbors === 2 || neighbors === 3)) ||
                     (!alive && neighbors === 3) ? 1 : 0;
      }
    }

    return next;
  }

  function countPopulation(grid) {
    let count = 0;
    for (let i = 0; i < grid.length; i++) {
      for (let j = 0; j < grid[i].length; j++) {
        count += grid[i][j];
      }
    }
    return count;
  }

  function gridsEqual(a, b) {
    if (a.length !== b.length || a.length === 0) return false;
    for (let i = 0; i < a.length; i++) {
      if (a[i].length !== b[i].length) return false;
      for (let j = 0; j < a[i].length; j++) {
        if (a[i][j] !== b[i][j]) return false;
      }
    }
    return true;
  }

  // ─── Hash Management ──────────────────────────────────────────

  function updateHashQuietly(rle) {
    // Use replaceState to avoid triggering hashchange events
    const url = new URL(window.location);
    url.hash = rle;
    window.history.replaceState(null, '', url.toString());
  }

  function getHashRLE() {
    return window.location.hash.slice(1);
  }

  // ─── Initialization ───────────────────────────────────────────

  function loadFromHash() {
    const hashRLE = getHashRLE();
    let rle = hashRLE || DEFAULT_RLE;

    try {
      const parsed = parseRLE(rle);
      initialGrid = parsed.grid;
      rows = parsed.rows;
      cols = parsed.cols;
      currentGrid = copyGrid(initialGrid);
      initialRLE = rle;
      generation = 0;
      stopLoop();
      running = false;
      updateUI();
      render();
      return true;
    } catch (e) {
      showError('Invalid RLE: ' + e.message + '. Using default pattern.');
      const parsed = parseRLE(DEFAULT_RLE);
      initialGrid = parsed.grid;
      rows = parsed.rows;
      cols = parsed.cols;
      currentGrid = copyGrid(initialGrid);
      initialRLE = DEFAULT_RLE;
      generation = 0;
      stopLoop();
      running = false;
      updateUI();
      render();
      return false;
    }
  }

  function resetToInitial() {
    if (!initialGrid) return;
    currentGrid = copyGrid(initialGrid);
    generation = 0;
    stopLoop();
    running = false;
    updateUI();
    render();
    updateHashQuietly(initialRLE);
  }

  function clearGrid() {
    if (!initialGrid) return;
    currentGrid = [];
    for (let i = 0; i < rows; i++) {
      currentGrid.push(new Int8Array(cols));
    }
    generation = 0;
    stopLoop();
    running = false;
    updateUI();
    render();
    updateHashQuietly(encodeRLE(currentGrid));
  }

  // ─── Simulation Loop ──────────────────────────────────────────

  function startLoop() {
    stopLoop();
    running = true;
    btnPlay.textContent = '⏸ Pause';
    btnPlay.classList.add('active');
    lastTickTime = performance.now();
    requestAnimationFrame(tick);
  }

  function stopLoop() {
    running = false;
    btnPlay.textContent = '▶ Play';
    btnPlay.classList.remove('active');
    if (animId !== null) {
      cancelAnimationFrame(animId);
      animId = null;
    }
  }

  function tick(timestamp) {
    if (!running) return;

    if (timestamp - lastTickTime >= tickInterval) {
      step();
      lastTickTime = timestamp;
    }

    animId = requestAnimationFrame(tick);
  }

  function step() {
    if (rows === 0 || cols === 0) return;
    currentGrid = nextGeneration(currentGrid, rows, cols);
    generation++;
    updateUI();
    render();

    // Update hash without feedback
    updateHashQuietly(encodeRLE(currentGrid));
  }

  // ─── Rendering ────────────────────────────────────────────────

  function render() {
    const w = cols * CELL_SIZE;
    const h = rows * CELL_SIZE;

    canvas.width = w;
    canvas.height = h;

    ctx.fillStyle = GRID_BG;
    ctx.fillRect(0, 0, w, h);

    // Draw dead cells (subtle)
    for (let i = 0; i < rows; i++) {
      for (let j = 0; j < cols; j++) {
        if (currentGrid[i][j] === 0) {
          ctx.fillStyle = DEAD_COLOR;
          ctx.fillRect(j * CELL_SIZE, i * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        }
      }
    }

    // Draw live cells
    for (let i = 0; i < rows; i++) {
      for (let j = 0; j < cols; j++) {
        if (currentGrid[i][j] === 1) {
          ctx.fillStyle = CELL_BG;
          ctx.fillRect(j * CELL_SIZE, i * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        }
      }
    }

    // Draw grid lines
    ctx.strokeStyle = GRID_LINE;
    ctx.lineWidth = 0.5;

    for (let i = 0; i <= rows; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * CELL_SIZE);
      ctx.lineTo(w, i * CELL_SIZE);
      ctx.stroke();
    }

    for (let j = 0; j <= cols; j++) {
      ctx.beginPath();
      ctx.moveTo(j * CELL_SIZE, 0);
      ctx.lineTo(j * CELL_SIZE, h);
      ctx.stroke();
    }
  }

  // ─── UI Updates ───────────────────────────────────────────────

  function updateUI() {
    genCountEl.textContent = generation;
    popCountEl.textContent = countPopulation(currentGrid);
    gridSizeEl.textContent = rows + ' × ' + cols;
    rleOutput.value = encodeRLE(currentGrid);
  }

  function showError(msg) {
    errorEl.textContent = msg;
  }

  function clearError() {
    errorEl.textContent = '';
  }

  // ─── Event Handlers ───────────────────────────────────────────

  // Play/Pause
  btnPlay.addEventListener('click', function() {
    if (running) {
      stopLoop();
    } else {
      startLoop();
    }
  });

  // Step
  btnStep.addEventListener('click', function() {
    stopLoop();
    step();
  });

  // Reset
  btnReset.addEventListener('click', function() {
    resetToInitial();
  });

  // Clear
  btnClear.addEventListener('click', function() {
    clearGrid();
  });

  // Canvas click to toggle cells (only when paused)
  canvas.addEventListener('click', function(e) {
    if (running) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    const col = Math.floor(x / CELL_SIZE);
    const row = Math.floor(y / CELL_SIZE);

    if (row >= 0 && row < rows && col >= 0 && col < cols) {
      currentGrid[row][col] = currentGrid[row][col] ? 0 : 1;
      generation = 0;
      updateUI();
      render();
      updateHashQuietly(encodeRLE(currentGrid));
    }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', function(e) {
    // Don't capture if user is interacting with the textarea
    if (e.target === rleOutput) {
      if (e.key === 'Escape') {
        rleOutput.blur();
      }
      return;
    }

    switch (e.key) {
      case ' ':
        e.preventDefault();
        if (running) {
          stopLoop();
        } else {
          startLoop();
        }
        break;
      case 's':
      case 'S':
        e.preventDefault();
        stopLoop();
        step();
        break;
      case 'r':
      case 'R':
        e.preventDefault();
        resetToInitial();
        break;
      case 'c':
      case 'C':
        e.preventDefault();
        clearGrid();
        break;
    }
  });

  // Hash change — only react to external changes (not our own updates)
  let lastHash = getHashRLE();
  window.addEventListener('hashchange', function() {
    const newHash = getHashRLE();
    if (newHash !== lastHash) {
      lastHash = newHash;
      try {
        const parsed = parseRLE(newHash || DEFAULT_RLE);
        initialGrid = parsed.grid;
        rows = parsed.rows;
        cols = parsed.cols;
        currentGrid = copyGrid(initialGrid);
        initialRLE = newHash || DEFAULT_RLE;
        generation = 0;
        stopLoop();
        running = false;
        updateUI();
        render();
        clearError();
      } catch (e) {
        showError('Hash RLE error: ' + e.message);
      }
    }
  });

  // ─── Boot ─────────────────────────────────────────────────────

  loadFromHash();

})();
</script>
</body>
</html>
