<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway's Game of Life</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080810;color:#c8c8d8;font-family:'SF Mono','Cascadia Code','Fira Code','Consolas','Monaco',monospace;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#101020;border-bottom:1px solid #222240;flex-wrap:wrap;min-height:44px}
#toolbar button{background:#1a1a30;color:#8888cc;border:1px solid #303060;padding:4px 14px;font-family:inherit;font-size:12px;cursor:pointer;border-radius:3px;transition:all .15s;white-space:nowrap}
#toolbar button:hover{background:#2a2a50;color:#aaaaff;border-color:#5050a0}
#toolbar button:active{background:#3a3a60}
#toolbar button.active{background:#2a2a60;color:#aaaaff;border-color:#6060c0}
.sep{width:1px;height:22px;background:#303050;flex-shrink:0}
#url-input{flex:1;min-width:180px;background:#0a0a18;border:1px solid #303060;padding:4px 10px;font-family:inherit;font-size:12px;color:#8888cc;border-radius:3px;outline:none;transition:border-color .2s}
#url-input:focus{border-color:#6060a0}
#url-input.error{border-color:#cc4444}
#info{display:flex;gap:14px;font-size:11px;color:#666688;flex-shrink:0}
#info span{white-space:nowrap}
#info b{color:#8888cc}
#canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0}
#grid{display:block;image-rendering:pixelated;border:1px solid #1a1a30;cursor:crosshair}
#status{padding:4px 12px;background:#0c0c1a;border-top:1px solid #1a1a30;font-size:11px;color:#555577;display:flex;align-items:center;gap:8px;min-height:26px}
#status .error{color:#cc4444}
#status .ok{color:#44cc66}
#help{padding:3px 12px;background:#0a0a14;border-top:1px solid #141420;font-size:10px;color:#3a3a55}
</style>
</head>
<body>

<div id="toolbar">
  <button id="btn-play" title="Space">▶ Play</button>
  <button id="btn-step" title="S">⏭ Step</button>
  <button id="btn-reset" title="R">↺ Reset</button>
  <button id="btn-clear" title="C">✕ Clear</button>
  <div class="sep"></div>
  <input id="url-input" type="text" placeholder="RLE input…" spellcheck="false" autocomplete="off" />
  <div class="sep"></div>
  <div id="info">
    <span>Grid: <b id="info-size">-</b></span>
    <span>Tick: <b id="info-tick">0</b></span>
    <span>Pop: <b id="info-pop">0</b></span>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="grid"></canvas>
</div>

<div id="status"><span class="ok" id="status-text">Ready</span></div>
<div id="help">Space: play/pause &nbsp;|&nbsp; S: step &nbsp;|&nbsp; R: reset &nbsp;|&nbsp; C: clear &nbsp;|&nbsp; Click: toggle</div>

<script>
(function() {
'use strict';

/* ─── constants ─── */
const CELL_SIZE   = 12;
const BG          = '#080810';
const GRID_COLOR  = '#141420';
const LIVE_COLOR  = '#4488ff';
const LIVE_GLOW   = '#6699ff';
const DEAD_COLOR  = '#0c0c16';
const DEFAULT_RLE = 'o2bo3bo'; // blinker

/* ─── DOM refs ─── */
const canvas       = document.getElementById('grid');
const ctx          = canvas.getContext('2d');
const btnPlay      = document.getElementById('btn-play');
const btnStep      = document.getElementById('btn-step');
const btnReset     = document.getElementById('btn-reset');
const btnClear     = document.getElementById('btn-clear');
const urlInput     = document.getElementById('url-input');
const statusText   = document.getElementById('status-text');
const infoSize     = document.getElementById('info-size');
const infoTick     = document.getElementById('info-tick');
const infoPop      = document.getElementById('info-pop');

/* ─── state ─── */
let grid      = null;   // 2D array of 0/1
let rows      = 0;
let cols      = 0;
let tickCount = 0;
let running   = false;
let animId    = null;
let initialRLE = '';
let initialGrid = null;
let cellSize  = CELL_SIZE;
let cellPad   = 1;
let gridW, gridH;

/* ─── helpers ─── */
function gridKey() {
  if (!grid) return '';
  let s = '';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) s += grid[r][c];
    if (r < rows - 1) s += '|';
  }
  return s;
}

function setHash(val) {
  if (history.replaceState) {
    history.replaceState(null, '', '#' + val);
  } else {
    location.hash = val;
  }
}

function getHash() {
  return location.hash.slice(1);
}

function setStatus(msg, isError) {
  statusText.textContent = msg;
  statusText.className = isError ? 'error' : 'ok';
}

function updateInfo() {
  infoSize.textContent = cols + '×' + rows;
  infoTick.textContent = tickCount;
  let pop = 0;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      pop += grid[r][c];
  infoPop.textContent = pop;
}

/* ─── RLE parser ─── */
function parseRLE(str) {
  if (!str || str.trim() === '') return null;
  str = str.trim();

  const rows = [];
  let row = [];
  let i = 0;
  let len = str.length;

  while (i < len) {
    const ch = str[i];

    if (ch === '!') {
      if (row.length > 0) rows.push(row);
      row = [];
      i++;
      continue;
    }

    if (ch === 'o' || ch === 'b') {
      row.push(ch === 'o' ? 1 : 0);
      i++;
      continue;
    }

    if (ch >= '1' && ch <= '9') {
      let num = parseInt(ch, 10);
      i++;
      while (i < len && str[i] >= '0' && str[i] <= '9') {
        num = num * 10 + parseInt(str[i], 10);
        i++;
      }
      if (i >= len) throw new Error('Trailing digit(s) with no cell character at position ' + i);
      const cellCh = str[i];
      if (cellCh !== 'o' && cellCh !== 'b') {
        throw new Error('Invalid cell character "' + cellCh + '" after count at position ' + i);
      }
      const val = cellCh === 'o' ? 1 : 0;
      for (let k = 0; k < num; k++) row.push(val);
      i++;
      continue;
    }

    throw new Error('Unexpected character "' + ch + '" at position ' + i);
  }

  if (row.length > 0) rows.push(row);
  if (rows.length === 0) return null;

  // Determine max column width
  let maxCols = 0;
  for (const r of rows) if (r.length > maxCols) maxCols = r.length;

  // Pad rows to maxCols
  for (const r of rows) {
    while (r.length < maxCols) r.push(0);
  }

  return { rows: rows.length, cols: maxCols, grid: rows };
}

/* ─── RLE encoder ─── */
function encodeRLE(grid, rows, cols) {
  let parts = [];
  for (let r = 0; r < rows; r++) {
    let count = 0;
    let prev = -1;
    for (let c = 0; c < cols; c++) {
      const val = grid[r][c];
      if (val === prev) {
        count++;
      } else {
        if (count > 0) {
          parts.push(count > 1 ? count : '');
          parts.push(prev === 1 ? 'o' : 'b');
        }
        prev = val;
        count = 1;
      }
    }
    if (count > 0) {
      parts.push(count > 1 ? count : '');
      parts.push(prev === 1 ? 'o' : 'b');
    }
    parts.push('!');
  }
  return parts.join('');
}

/* ─── Game of Life step ─── */
function stepGame() {
  if (!grid) return;
  const next = [];
  for (let r = 0; r < rows; r++) {
    next.push(new Array(cols));
    for (let c = 0; c < cols; c++) {
      let neighbors = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr, nc = c + dc;
          if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
          neighbors += grid[nr][nc];
        }
      }
      next[r][c] = grid[r][c]
        ? (neighbors === 2 || neighbors === 3 ? 1 : 0)
        : (neighbors === 3 ? 1 : 0);
    }
  }
  grid = next;
  tickCount++;
}

/* ─── Rendering ─── */
function render() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!grid) return;

  // Draw cell backgrounds
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      ctx.fillStyle = DEAD_COLOR;
      ctx.fillRect(
        c * cellSize,
        r * cellSize,
        cellSize - cellPad,
        cellSize - cellPad
      );
    }
  }

  // Draw live cells
  ctx.fillStyle = LIVE_GLOW;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c]) {
        ctx.fillRect(
          c * cellSize + 1,
          r * cellSize + 1,
          cellSize - cellPad - 2,
          cellSize - cellPad - 2
        );
      }
    }
  }

  // Draw live cell inner highlight
  ctx.fillStyle = LIVE_COLOR;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c]) {
        ctx.fillRect(
          c * cellSize + 2,
          r * cellSize + 2,
          cellSize - cellPad - 4,
          cellSize - cellPad - 4
        );
      }
    }
  }
}

/* ─── Canvas sizing ─── */
function resizeCanvas() {
  if (!grid) {
    canvas.width = 0;
    canvas.height = 0;
    return;
  }
  // Use smallest cell size that fits
  const wrap = document.getElementById('canvas-wrap');
  const maxW = wrap.clientWidth - 20;
  const maxH = wrap.clientHeight - 20;

  let bestSize = CELL_SIZE;
  for (let s = 8; s >= 4; s--) {
    if ((cols * s) <= maxW && (rows * s) <= maxH) {
      bestSize = s;
      break;
    }
  }
  cellSize = bestSize;
  cellPad = 1;

  canvas.width = cols * cellSize;
  canvas.height = rows * cellSize;
}

/* ─── Load from hash ─── */
function loadFromHash() {
  const hash = getHash();
  if (!hash) {
    loadRLE(DEFAULT_RLE);
    return;
  }
  loadRLE(hash);
}

function loadRLE(rleStr) {
  try {
    const result = parseRLE(rleStr);
    if (!result) {
      setStatus('Empty input — use default pattern', false);
      loadRLE(DEFAULT_RLE);
      return;
    }
    initialRLE = rleStr;
    initialGrid = result.grid.map(r => [...r]);
    rows = result.rows;
    cols = result.cols;
    grid = result.grid;
    tickCount = 0;
    urlInput.value = rleStr;
    urlInput.classList.remove('error');
    setStatus('Loaded: ' + rleStr, false);
    resizeCanvas();
    render();
    updateInfo();
    updatePlayButton();
  } catch (e) {
    urlInput.classList.add('error');
    setStatus('Parse error: ' + e.message, true);
    grid = null;
    rows = 0;
    cols = 0;
    tickCount = 0;
    initialGrid = null;
    initialRLE = '';
    resizeCanvas();
    render();
    updateInfo();
  }
}

/* ─── Animation loop ─── */
function tick() {
  stepGame();
  render();
  updateInfo();
  updateHash();
}

function updateHash() {
  if (grid) {
    const rle = encodeRLE(grid, rows, cols);
    setHash(rle);
  }
}

function animLoop() {
  if (!running) return;
  tick();
  animId = requestAnimationFrame(animLoop);
}

function startPlaying() {
  running = true;
  updatePlayButton();
  animId = requestAnimationFrame(animLoop);
}

function stopPlaying() {
  running = false;
  if (animId) {
    cancelAnimationFrame(animId);
    animId = null;
  }
  updatePlayButton();
}

function togglePlay() {
  if (running) stopPlaying();
  else startPlaying();
}

function updatePlayButton() {
  btnPlay.textContent = running ? '⏸ Pause' : '▶ Play';
  btnPlay.classList.toggle('active', running);
}

/* ─── Event handlers ─── */
btnPlay.addEventListener('click', togglePlay);
btnStep.addEventListener('click', () => {
  stopPlaying();
  stepGame();
  render();
  updateInfo();
  updateHash();
});
btnReset.addEventListener('click', () => {
  stopPlaying();
  if (initialGrid) {
    grid = initialGrid.map(r => [...r]);
    tickCount = 0;
    resizeCanvas();
    render();
    updateInfo();
    updateHash();
    setStatus('Reset to initial state', false);
  }
});
btnClear.addEventListener('click', () => {
  stopPlaying();
  grid = null;
  rows = 0;
  cols = 0;
  tickCount = 0;
  initialGrid = null;
  initialRLE = '';
  resizeCanvas();
  render();
  updateInfo();
  urlInput.value = '';
  urlInput.classList.remove('error');
  setHash('');
  setStatus('Cleared', false);
});

urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const val = urlInput.value.trim();
    if (val) loadRLE(val);
  }
});

urlInput.addEventListener('input', () => {
  urlInput.classList.remove('error');
  setStatus('Editing…', false);
});

// Canvas click to toggle cells
canvas.addEventListener('click', (e) => {
  if (running) return;
  if (!grid) return;

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  const c = Math.floor(x / cellSize);
  const r = Math.floor(y / cellSize);

  if (r >= 0 && r < rows && c >= 0 && c < cols) {
    grid[r][c] = grid[r][c] ? 0 : 1;
    render();
    updateInfo();
    updateHash();
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  // Don't capture when typing in input
  if (e.target === urlInput) {
    if (e.key === 'Escape') urlInput.blur();
    return;
  }

  switch (e.key) {
    case ' ':
      e.preventDefault();
      togglePlay();
      break;
    case 's':
    case 'S':
      e.preventDefault();
      stopPlaying();
      stepGame();
      render();
      updateInfo();
      updateHash();
      break;
    case 'r':
    case 'R':
      e.preventDefault();
      stopPlaying();
      if (initialGrid) {
        grid = initialGrid.map(r => [...r]);
        tickCount = 0;
        resizeCanvas();
        render();
        updateInfo();
        updateHash();
        setStatus('Reset to initial state', false);
      }
      break;
    case 'c':
    case 'C':
      e.preventDefault();
      stopPlaying();
      grid = null;
      rows = 0;
      cols = 0;
      tickCount = 0;
      initialGrid = null;
      initialRLE = '';
      resizeCanvas();
      render();
      updateInfo();
      urlInput.value = '';
      urlInput.classList.remove('error');
      setHash('');
      setStatus('Cleared', false);
      break;
  }
});

/* ─── Handle URL hash changes (from browser back/forward) ─── */
window.addEventListener('hashchange', () => {
  if (running) stopPlaying();
  const hash = getHash();
  if (hash) {
    loadRLE(hash);
  } else {
    loadRLE(DEFAULT_RLE);
  }
});

/* ─── Window resize ─── */
window.addEventListener('resize', () => {
  if (grid) resizeCanvas();
});

/* ─── Init ─── */
loadFromHash();

})();
</script>
</body>
</html>
