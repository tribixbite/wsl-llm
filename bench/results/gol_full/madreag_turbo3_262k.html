<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway's Game of Life — RLE URL</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    overflow-x: hidden;
  }

  h1 {
    font-size: 1.6rem;
    margin-bottom: 8px;
    color: #58a6ff;
    font-weight: 600;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 0.8rem;
    color: #8b949e;
    margin-bottom: 16px;
  }

  #game-container {
    position: relative;
    border: 2px solid #30363d;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    line-height: 0;
  }

  canvas {
    display: block;
    cursor: crosshair;
  }

  .controls {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    transition: all 0.15s ease;
    font-family: inherit;
  }

  button:hover { background: #30363d; border-color: #8b949e; }
  button:active { transform: scale(0.97); }

  button.primary {
    background: #238636;
    border-color: #2ea043;
    color: #fff;
  }
  button.primary:hover { background: #2ea043; }

  button.danger {
    background: #3d1f1f;
    border-color: #f8514966;
    color: #f85149;
  }
  button.danger:hover { background: #4d2626; }

  .status-bar {
    display: flex;
    gap: 20px;
    margin-top: 12px;
    font-size: 0.8rem;
    color: #8b949e;
    flex-wrap: wrap;
    justify-content: center;
  }

  .status-bar span { display: flex; align-items: center; gap: 4px; }
  .status-bar .label { color: #6e7681; }
  .status-bar .value { color: #c9d1d9; font-weight: 600; font-variant-numeric: tabular-nums; }

  .url-bar {
    margin-top: 12px;
    width: 100%;
    max-width: 700px;
  }

  .url-bar input {
    width: 100%;
    background: #161b22;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-family: 'Consolas', 'Monaco', monospace;
    outline: none;
    transition: border-color 0.15s;
  }

  .url-bar input:focus { border-color: #58a6ff; }

  .error-msg {
    color: #f85149;
    font-size: 0.8rem;
    margin-top: 8px;
    background: #3d1f1f;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid #f8514944;
    display: none;
    max-width: 700px;
    text-align: center;
  }

  .error-msg.visible { display: block; }

  .shortcuts {
    margin-top: 16px;
    font-size: 0.72rem;
    color: #484f58;
    text-align: center;
    line-height: 1.8;
  }

  .shortcuts kbd {
    background: #21262d;
    border: 1px solid #30363d;
    padding: 1px 6px;
    border-radius: 3px;
    font-family: monospace;
    font-size: 0.72rem;
    color: #8b949e;
  }

  .speed-control {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 0.8rem;
    color: #8b949e;
  }

  .speed-control input[type="range"] {
    width: 100px;
    accent-color: #58a6ff;
  }
</style>
</head>
<body>

<h1>Conway's Game of Life</h1>
<p class="subtitle">RLE-encoded state via URL hash — share any frame by copying the URL</p>

<div id="game-container">
  <canvas id="canvas"></canvas>
</div>

<div class="controls">
  <button id="btn-toggle" class="primary">▶ Start</button>
  <button id="btn-step">⏭ Step</button>
  <button id="btn-reset">↺ Reset</button>
  <button id="btn-clear" class="danger">✕ Clear</button>
</div>

<div class="status-bar">
  <span><span class="label">Tick:</span> <span class="value" id="tick-count">0</span></span>
  <span><span class="label">Size:</span> <span class="value" id="grid-size">—</span></span>
  <span><span class="label">Live:</span> <span class="value" id="live-count">—</span></span>
  <span><span class="label">Status:</span> <span class="value" id="status-text">Paused</span></span>
</div>

<div class="speed-control">
  <span>Speed:</span>
  <input type="range" id="speed-slider" min="1" max="60" value="10">
  <span id="speed-val">10 fps</span>
</div>

<div class="url-bar">
  <input id="url-input" type="text" readonly placeholder="URL hash updates live…">
</div>

<div class="error-msg" id="error-msg"></div>

<div class="shortcuts">
  <kbd>Space</kbd> Play/Pause &nbsp; <kbd>S</kbd> Step &nbsp; <kbd>R</kbd> Reset &nbsp; <kbd>C</kbd> Clear &nbsp; <kbd>Click</kbd> toggle cell (paused)
</div>

<script>
(function() {
  'use strict';

  // ─── DOM refs ────────────────────────────────────────────────
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const btnToggle = document.getElementById('btn-toggle');
  const btnStep = document.getElementById('btn-step');
  const btnReset = document.getElementById('btn-reset');
  const btnClear = document.getElementById('btn-clear');
  const tickCountEl = document.getElementById('tick-count');
  const gridSizeEl = document.getElementById('grid-size');
  const liveCountEl = document.getElementById('live-count');
  const statusTextEl = document.getElementById('status-text');
  const urlInput = document.getElementById('url-input');
  const errorMsg = document.getElementById('error-msg');
  const speedSlider = document.getElementById('speed-slider');
  const speedVal = document.getElementById('speed-val');

  // ─── Constants ───────────────────────────────────────────────
  const CELL_SIZE = 10;
  const GRID_BG = '#0d1117';
  const CELL_COLOR = '#58a6ff';
  const GRID_LINE_COLOR = '#161b22';
  const ERROR_DEFAULT_RLE = 'o2c!'; // small blinker-like default

  // ─── State ───────────────────────────────────────────────────
  let grid = [];
  let rows = 0;
  let cols = 0;
  let tickCount = 0;
  let running = false;
  let initialRLE = '';
  let animFrameId = null;
  let lastTickTime = 0;
  let fps = 10;
  let isUpdatingHash = false;

  // ─── RLE Parsing ─────────────────────────────────────────────
  function parseRLE(rle) {
    if (!rle || rle.trim() === '') {
      throw new Error('Empty RLE string.');
    }

    // Validate characters
    const allowed = /^[0-9]*[obc!]+$/i;
    if (!allowed.test(rle.trim())) {
      throw new Error('Invalid RLE characters. Use digits, o/b/c, and ! only.');
    }

    const rleClean = rle.trim().toLowerCase().replace(/!/g, '! ');
    const tokens = rleClean.split(/\s+/).filter(Boolean);

    const rowStrings = [];
    let currentRow = '';
    let i = 0;

    while (i < tokens.length) {
      const token = tokens[i];
      if (token === '!') {
        if (currentRow.length > 0) {
          rowStrings.push(currentRow);
          currentRow = '';
        }
      } else {
        currentRow += token;
      }
      i++;
    }
    if (currentRow.length > 0) {
      rowStrings.push(currentRow);
    }

    if (rowStrings.length === 0) {
      throw new Error('RLE produced no rows.');
    }

    // Parse each row into a cell array
    const parsedRows = [];
    for (let r = 0; r < rowStrings.length; r++) {
      const rowStr = rowStrings[r];
      const cells = [];
      let j = 0;
      while (j < rowStr.length) {
        let count = 1;
        if (j < rowStr.length && rowStr[j] >= '0' && rowStr[j] <= '9') {
          count = parseInt(rowStr.substring(j), 10);
          j += (rowStr[j + 1] >= '0' && rowStr[j + 1] <= '9') ? 2 : 1;
          // Handle multi-digit
          while (j < rowStr.length && rowStr[j] >= '0' && rowStr[j] <= '9') {
            count = count * 10 + parseInt(rowStr[j], 10);
            j++;
          }
        }
        if (j >= rowStr.length) {
          throw new Error('RLE row "' + rowStr + '" ends with digit but no cell type.');
        }
        const type = rowStr[j];
        if (type !== 'o' && type !== 'b' && type !== 'c') {
          throw new Error('Invalid cell type "' + type + '" in RLE row ' + (r + 1) + '.');
        }
        const val = (type === 'o') ? 1 : 0;
        for (let k = 0; k < count; k++) {
          cells.push(val);
        }
        j++;
      }
      parsedRows.push(cells);
    }

    // Compute grid dimensions
    let maxCols = 0;
    for (let r = 0; r < parsedRows.length; r++) {
      if (parsedRows[r].length > maxCols) maxCols = parsedRows[r].length;
    }

    // Pad shorter rows with dead cells
    for (let r = 0; r < parsedRows.length; r++) {
      while (parsedRows[r].length < maxCols) {
        parsedRows[r].push(0);
      }
    }

    return { grid: parsedRows, rows: parsedRows.length, cols: maxCols };
  }

  // ─── RLE Encoding ────────────────────────────────────────────
  function encodeRLE(grid, numRows, numCols) {
    const rows = [];
    for (let r = 0; r < numRows; r++) {
      let rowStr = '';
      let i = 0;
      while (i < numCols) {
        const val = (r < grid.length && grid[r] && grid[r][i]) ? 1 : 0;
        let count = 1;
        while (i + count < numCols) {
          const nextVal = (grid[r] && grid[r][i + count]) ? 1 : 0;
          if (nextVal !== val) break;
          count++;
        }
        if (val === 1) {
          rowStr += (count > 1 ? count : '') + 'o';
        } else {
          rowStr += (count > 1 ? count : '') + 'b';
        }
        i += count;
      }
      rows.push(rowStr);
    }
    return rows.join('!');
  }

  // ─── Grid Operations ─────────────────────────────────────────
  function copyGrid(g, r, c) {
    const copy = [];
    for (let i = 0; i < r; i++) {
      copy.push(g[i] ? g[i].slice() : new Array(c).fill(0));
    }
    return copy;
  }

  function countLive(g, r, c) {
    let count = 0;
    for (let i = 0; i < r; i++) {
      if (!g[i]) continue;
      for (let j = 0; j < c; j++) {
        if (g[i][j]) {
          // count neighbors
          let neighbors = 0;
          for (let di = -1; di <= 1; di++) {
            for (let dj = -1; dj <= 1; dj++) {
              if (di === 0 && dj === 0) continue;
              const ni = i + di;
              const nj = j + dj;
              if (ni >= 0 && ni < r && nj >= 0 && nj < c && g[ni][nj]) {
                neighbors++;
              }
            }
          }
          count++;
        }
      }
    }
    return count;
  }

  function step() {
    const newGrid = [];
    for (let i = 0; i < rows; i++) {
      const newRow = [];
      for (let j = 0; j < cols; j++) {
        let neighbors = 0;
        for (let di = -1; di <= 1; di++) {
          for (let dj = -1; dj <= 1; dj++) {
            if (di === 0 && dj === 0) continue;
            const ni = i + di;
            const nj = j + dj;
            if (ni >= 0 && ni < rows && nj >= 0 && nj < cols && grid[ni][nj]) {
              neighbors++;
            }
          }
        }
        const alive = grid[i][j];
        if (alive) {
          newRow.push(neighbors === 2 || neighbors === 3 ? 1 : 0);
        } else {
          newRow.push(neighbors === 3 ? 1 : 0);
        }
      }
      newGrid.push(newRow);
    }
    grid = newGrid;
    tickCount++;
  }

  // ─── Rendering ───────────────────────────────────────────────
  function render() {
    canvas.width = cols * CELL_SIZE;
    canvas.height = rows * CELL_SIZE;

    ctx.fillStyle = GRID_BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw grid lines
    ctx.strokeStyle = GRID_LINE_COLOR;
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= cols; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL_SIZE, 0);
      ctx.lineTo(i * CELL_SIZE, rows * CELL_SIZE);
      ctx.stroke();
    }
    for (let j = 0; j <= rows; j++) {
      ctx.beginPath();
      ctx.moveTo(0, j * CELL_SIZE);
      ctx.lineTo(cols * CELL_SIZE, j * CELL_SIZE);
      ctx.stroke();
    }

    // Draw live cells
    ctx.fillStyle = CELL_COLOR;
    for (let i = 0; i < rows; i++) {
      for (let j = 0; j < cols; j++) {
        if (grid[i] && grid[i][j]) {
          ctx.fillRect(j * CELL_SIZE + 0.5, i * CELL_SIZE + 0.5, CELL_SIZE - 1, CELL_SIZE - 1);
        }
      }
    }

    // Update UI
    tickCountEl.textContent = tickCount;
    gridSizeEl.textContent = cols + '×' + rows;
    liveCountEl.textContent = countLive(grid, rows, cols);
  }

  // ─── URL Hash Management ─────────────────────────────────────
  function getRLEFromHash() {
    const hash = window.location.hash.slice(1);
    if (!hash) return '';
    try {
      // Try to decode from base64 first (for long patterns)
      const decoded = decodeURIComponent(escape(atob(hash.replace(/_/g, '/').replace(/-/g, '+'))));
      // Check if it looks like RLE
      if (/^[0-9]*[obc!]+$/i.test(decoded.trim())) {
        return decoded.trim();
      }
    } catch(e) { /* not base64 */ }
    // Try direct URL decode
    try {
      const decoded = decodeURIComponent(hash);
      if (/^[0-9]*[obc!]+$/i.test(decoded.trim())) {
        return decoded.trim();
      }
    } catch(e) { /* not URL encoded */ }
    // Try as-is
    return hash;
  }

  function updateHash(rle) {
    if (isUpdatingHash) return;
    isUpdatingHash = true;

    try {
      const encoded = btoa(unescape(encodeURIComponent(rle)));
      const safeHash = encoded.replace(/\+/g, '-').replace(/\//g, '_');
      window.location.hash = safeHash;
      urlInput.value = window.location.href;
    } catch(e) {
      // Fallback: direct hash
      try {
        const directHash = encodeURIComponent(rle);
        window.location.hash = directHash;
        urlInput.value = window.location.href;
      } catch(e2) {
        // Last resort
        window.location.hash = rle.substring(0, 500);
        urlInput.value = window.location.href;
      }
    }

    setTimeout(() => { isUpdatingHash = false; }, 50);
  }

  // ─── Hash Change Listener ────────────────────────────────────
  let hashChangeHandled = false;
  window.addEventListener('hashchange', function(e) {
    if (hashChangeHandled) return;
    hashChangeHandled = true;
    setTimeout(function() {
      hashChangeHandled = false;
      // Only load if we didn't just write the hash ourselves
      const newRLE = getRLEFromHash();
      if (newRLE !== initialRLE && newRLE !== '') {
        loadRLE(newRLE);
      }
    }, 100);
  });

  // ─── Load RLE ────────────────────────────────────────────────
  function loadRLE(rle) {
    stopLoop();
    running = false;
    tickCount = 0;
    hideError();

    try {
      const result = parseRLE(rle);
      grid = result.grid;
      rows = result.rows;
      cols = result.cols;
      initialRLE = rle;
      render();
      updateHash(initialRLE);
      updateStatus();
      return true;
    } catch(e) {
      showError('RLE Parse Error: ' + e.message);
      return false;
    }
  }

  // ─── Animation Loop ──────────────────────────────────────────
  function startLoop() {
    if (animFrameId) return;
    lastTickTime = performance.now();
    animFrameId = requestAnimationFrame(tickLoop);
  }

  function stopLoop() {
    if (animFrameId) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
  }

  function tickLoop(timestamp) {
    animFrameId = requestAnimationFrame(tickLoop);

    const interval = 1000 / fps;
    if (timestamp - lastTickTime >= interval) {
      lastTickTime = timestamp;
      step();
      render();
      updateHash(encodeRLE(grid, rows, cols));
      updateStatus();
    }
  }

  function updateStatus() {
    statusTextEl.textContent = running ? 'Running' : 'Paused';
    btnToggle.textContent = running ? '⏸ Pause' : '▶ Start';
  }

  // ─── Error Handling ──────────────────────────────────────────
  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
  }

  function hideError() {
    errorMsg.classList.remove('visible');
  }

  // ─── Event Handlers ──────────────────────────────────────────
  btnToggle.addEventListener('click', function() {
    running = !running;
    updateStatus();
    if (running) {
      startLoop();
    } else {
      stopLoop();
    }
  });

  btnStep.addEventListener('click', function() {
    stopLoop();
    running = false;
    step();
    render();
    updateHash(encodeRLE(grid, rows, cols));
    updateStatus();
  });

  btnReset.addEventListener('click', function() {
    loadRLE(initialRLE);
  });

  btnClear.addEventListener('click', function() {
    grid = [];
    rows = 0;
    cols = 0;
    tickCount = 0;
    stopLoop();
    running = false;
    updateStatus();
    render();
    updateHash('');
  });

  speedSlider.addEventListener('input', function() {
    fps = parseInt(this.value, 10);
    speedVal.textContent = fps + ' fps';
  });

  // Canvas click to toggle cells
  canvas.addEventListener('click', function(e) {
    if (running) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = Math.floor((e.clientX - rect.left) * scaleX / CELL_SIZE);
    const y = Math.floor((e.clientY - rect.top) * scaleY / CELL_SIZE);

    if (y >= 0 && y < rows && x >= 0 && x < cols) {
      if (!grid[y]) grid[y] = new Array(cols).fill(0);
      grid[y][x] = grid[y][x] ? 0 : 1;
      render();
      updateHash(encodeRLE(grid, rows, cols));
    }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', function(e) {
    // Don't capture if user is focused on the URL input
    if (document.activeElement === urlInput) return;

    switch(e.key) {
      case ' ':
        e.preventDefault();
        btnToggle.click();
        break;
      case 's':
      case 'S':
        btnStep.click();
        break;
      case 'r':
      case 'R':
        btnReset.click();
        break;
      case 'c':
      case 'C':
        btnClear.click();
        break;
    }
  });

  // ─── Initialization ──────────────────────────────────────────
  function init() {
    const rle = getRLEFromHash();

    if (rle && rle.trim() !== '') {
      loadRLE(rle);
    } else {
      // Default: small pattern
      const defaultRLE = '2o3bo2bo!bo2bo!3bo!'; // small glider
      loadRLE(defaultRLE);
    }

    // Show initial URL
    urlInput.value = window.location.href;
  }

  init();
})();
</script>
</body>
</html>
