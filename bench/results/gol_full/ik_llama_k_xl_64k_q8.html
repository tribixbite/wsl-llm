<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway's Game of Life</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #0a0a0f;
    color: #c8c8d0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    user-select: none;
}

h1 {
    font-size: 1.6rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: #7eb8da;
    margin-bottom: 16px;
    text-transform: uppercase;
}

#canvas-wrap {
    position: relative;
    border: 1px solid #1e2a3a;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(30, 80, 140, 0.12);
    cursor: crosshair;
}

canvas {
    display: block;
    background: #06060e;
}

#controls {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
    justify-content: center;
}

button {
    background: #141824;
    color: #a0b0c8;
    border: 1px solid #253040;
    padding: 8px 18px;
    border-radius: 4px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    letter-spacing: 0.03em;
}

button:hover { background: #1c2438; color: #c0d0e8; border-color: #3a5070; }
button:active { background: #243048; }
button.active { background: #1a3050; color: #7eb8da; border-color: #4a70a0; }

#info {
    margin-top: 12px;
    font-size: 0.78rem;
    color: #4a5a6a;
    text-align: center;
    line-height: 1.6;
}

kbd {
    background: #141824;
    border: 1px solid #253040;
    border-radius: 3px;
    padding: 1px 6px;
    font-size: 0.75rem;
    font-family: monospace;
    color: #7a8a9a;
}

#error {
    margin-top: 12px;
    padding: 10px 20px;
    background: #1a0a0a;
    border: 1px solid #3a1a1a;
    border-radius: 4px;
    color: #d06060;
    font-size: 0.85rem;
    display: none;
    max-width: 600px;
    text-align: center;
}

#rle-display {
    margin-top: 10px;
    font-family: monospace;
    font-size: 0.75rem;
    color: #3a4a5a;
    word-break: break-all;
    max-width: 700px;
    text-align: center;
    min-height: 1.2em;
}

#stats {
    font-size: 0.78rem;
    color: #3a5a7a;
    margin-top: 6px;
}
</style>
</head>
<body>

<h1>Game of Life</h1>

<div id="canvas-wrap">
    <canvas id="canvas"></canvas>
</div>

<div id="controls">
    <button id="btn-play">▶ Play</button>
    <button id="btn-step">⏭ Step</button>
    <button id="btn-reset">↺ Reset</button>
    <button id="btn-clear">✕ Clear</button>
</div>

<div id="rle-display"></div>
<div id="stats"></div>
<div id="error"></div>

<div id="info">
    <kbd>Space</kbd> play/pause &nbsp; <kbd>S</kbd> step &nbsp; <kbd>R</kbd> reset &nbsp; <kbd>C</kbd> clear &nbsp; Click to toggle
</div>

<script>
(function() {
    'use strict';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const btnPlay = document.getElementById('btn-play');
    const btnStep = document.getElementById('btn-step');
    const btnReset = document.getElementById('btn-reset');
    const btnClear = document.getElementById('btn-clear');
    const errorEl = document.getElementById('error');
    const rleDisplay = document.getElementById('rle-display');
    const statsEl = document.getElementById('stats');

    const CELL_SIZE = 8;
    const GRID_BORDER = 1;
    const DEAD_COLOR = '#06060e';
    const LIVE_COLOR = '#4a90d0';
    const LIVE_HOVER_COLOR = '#6ab0f0';
    const GRID_COLOR = '#0c0c16';

    let grid = [];
    let rows = 0;
    let cols = 0;
    let initialGrid = null;
    let initialRLE = '';
    let running = false;
    let animFrameId = null;
    let lastTick = 0;
    let tickInterval = 120;
    let generation = 0;
    let errorState = null;
    let hoverCell = null;

    function showError(msg) {
        errorState = msg;
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
    }

    function clearError() {
        errorState = null;
        errorEl.style.display = 'none';
    }

    function parseRLE(rleStr) {
        if (!rleStr || rleStr.trim() === '') return null;

        rleStr = rleStr.trim();
        const result = [];
        let i = 0;
        let currentRow = [];

        while (i < rleStr.length) {
            const ch = rleStr[i];

            if (ch === '!') {
                // End of row
                if (currentRow.length > 0) {
                    result.push(currentRow);
                }
                currentRow = [];
                i++;
                continue;
            }

            // Parse optional digit count
            let count = 1;
            if (ch >= '1' && ch <= '9') {
                let numStr = '';
                while (i < rleStr.length && rleStr[i] >= '0' && rleStr[i] <= '9') {
                    numStr += rleStr[i];
                    i++;
                }
                count = parseInt(numStr, 10);
                if (count < 1) throw new Error('Invalid count: ' + numStr);
            }

            // Parse cell character
            if (i >= rleStr.length) {
                throw new Error('Unexpected end of RLE after count');
            }

            const cellCh = rleStr[i];
            if (cellCh !== 'o' && cellCh !== 'b') {
                throw new Error('Invalid cell character: "' + cellCh + '" (expected "o" or "b")');
            }

            const isLive = cellCh === 'o';

            for (let j = 0; j < count; j++) {
                currentRow.push(isLive);
            }

            i++;
        }

        // Push last row if it has content
        if (currentRow.length > 0) {
            result.push(currentRow);
        }

        if (result.length === 0) {
            throw new Error('RLE produced no rows');
        }

        // Determine max column width
        let maxCols = 0;
        for (let r = 0; r < result.length; r++) {
            if (result[r].length > maxCols) {
                maxCols = result[r].length;
            }
        }

        if (maxCols === 0) {
            throw new Error('RLE produced no cells');
        }

        // Pad rows to maxCols with dead cells
        for (let r = 0; r < result.length; r++) {
            while (result[r].length < maxCols) {
                result[r].push(false);
            }
        }

        return result;
    }

    function gridToRLE(g) {
        let rle = '';
        for (let r = 0; r < g.length; r++) {
            const row = g[r];
            let i = 0;
            while (i < row.length) {
                const isLive = row[i];
                let count = 1;
                while (i + count < row.length && row[i + count] === isLive) {
                    count++;
                }
                if (count > 1 || (count === 1 && false)) {
                    // Always output count for clarity, but we can omit for 1
                    // Actually, compact RLE: omit 1
                    if (count > 1) {
                        rle += count + (isLive ? 'o' : 'b');
                    } else {
                        rle += (isLive ? 'o' : 'b');
                    }
                } else {
                    rle += (isLive ? 'o' : 'b');
                }
                i += count;
            }
            if (r < g.length - 1) {
                rle += '!';
            }
        }
        return rle;
    }

    function deepCopyGrid(g) {
        return g.map(row => Array.from(row));
    }

    function nextGeneration(g) {
        const r = g.length;
        const c = g[0].length;
        const next = [];
        for (let i = 0; i < r; i++) {
            next[i] = new Array(c);
            for (let j = 0; j < c; j++) {
                let neighbors = 0;
                for (let di = -1; di <= 1; di++) {
                    for (let dj = -1; dj <= 1; dj++) {
                        if (di === 0 && dj === 0) continue;
                        const ni = (i + di + r) % r;
                        const nj = (j + dj + c) % c;
                        if (g[ni][nj]) neighbors++;
                    }
                }
                next[i][j] = g[i][j] ? (neighbors === 2 || neighbors === 3) : (neighbors === 3);
            }
        }
        return next;
    }

    function computeDimensions(rleStr) {
        if (!rleStr || rleStr.trim() === '') {
            return { rows: 5, cols: 5 };
        }
        try {
            const parsed = parseRLE(rleStr);
            if (!parsed) return { rows: 5, cols: 5 };
            return { rows: parsed.length, cols: parsed[0].length };
        } catch (e) {
            return { rows: 5, cols: 5 };
        }
    }

    function resizeCanvas() {
        const dim = computeDimensions(initialRLE);
        rows = dim.rows;
        cols = dim.cols;

        const maxW = Math.min(window.innerWidth - 40, 1200);
        const maxH = Math.min(window.innerHeight - 280, 800);

        let cellSize = CELL_SIZE;
        const fitW = Math.floor(maxW / cols);
        const fitH = Math.floor(maxH / rows);
        if (fitW < cellSize) cellSize = fitW;
        if (fitH < cellSize) cellSize = fitH;
        if (cellSize < 2) cellSize = 2;

        canvas.width = cols * cellSize + GRID_BORDER * 2;
        canvas.height = rows * cellSize + GRID_BORDER * 2;
        canvas.style.width = canvas.width + 'px';
        canvas.style.height = canvas.height + 'px';
    }

    function render() {
        const cellSize = canvas.width / cols;
        const cellH = canvas.height / rows;

        ctx.fillStyle = DEAD_COLOR;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw grid lines
        if (cellSize >= 4) {
            ctx.strokeStyle = GRID_COLOR;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            for (let c = 0; c <= cols; c++) {
                ctx.moveTo(c * cellSize + GRID_BORDER, GRID_BORDER);
                ctx.lineTo(c * cellSize + GRID_BORDER, canvas.height - GRID_BORDER);
            }
            for (let r = 0; r <= rows; r++) {
                ctx.moveTo(GRID_BORDER, r * cellH + GRID_BORDER);
                ctx.lineTo(canvas.width - GRID_BORDER, r * cellH + GRID_BORDER);
            }
            ctx.stroke();
        }

        // Draw cells
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const x = c * cellSize + GRID_BORDER;
                const y = r * cellH + GRID_BORDER;
                const w = cellSize - GRID_BORDER;
                const h = cellH - GRID_BORDER;

                if (grid[r][c]) {
                    ctx.fillStyle = LIVE_COLOR;
                    ctx.fillRect(x, y, w, h);
                    // Subtle inner highlight
                    if (cellSize >= 6) {
                        ctx.fillStyle = 'rgba(255,255,255,0.08)';
                        ctx.fillRect(x, y, w, h * 0.4);
                    }
                } else if (hoverCell && hoverCell[0] === r && hoverCell[1] === c) {
                    ctx.fillStyle = LIVE_HOVER_COLOR;
                    ctx.globalAlpha = 0.3;
                    ctx.fillRect(x, y, w, h);
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        // Border
        ctx.strokeStyle = '#1e2a3a';
        ctx.lineWidth = 1;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);
    }

    function tick() {
        if (errorState) return;
        grid = nextGeneration(grid);
        generation++;
        updateHash();
        render();
        updateStats();
    }

    function gameLoop(timestamp) {
        if (!running) return;
        if (timestamp - lastTick >= tickInterval) {
            tick();
            lastTick = timestamp;
        }
        animFrameId = requestAnimationFrame(gameLoop);
    }

    function start() {
        if (errorState) return;
        running = true;
        lastTick = performance.now();
        btnPlay.textContent = '⏸ Pause';
        btnPlay.classList.add('active');
        animFrameId = requestAnimationFrame(gameLoop);
    }

    function pause() {
        running = false;
        if (animFrameId) {
            cancelAnimationFrame(animFrameId);
            animFrameId = null;
        }
        btnPlay.textContent = '▶ Play';
        btnPlay.classList.remove('active');
    }

    function step() {
        if (errorState) return;
        if (running) pause();
        tick();
    }

    function reset() {
        if (errorState) {
            clearError();
            initialGrid = null;
            grid = [];
            rows = 0;
            cols = 0;
            generation = 0;
            resizeCanvas();
            render();
            updateStats();
            return;
        }
        pause();
        if (initialGrid) {
            grid = deepCopyGrid(initialGrid);
        } else {
            grid = [];
            rows = 0;
            cols = 0;
        }
        generation = 0;
        clearError();
        resizeCanvas();
        render();
        updateStats();
        updateHash();
    }

    function clear() {
        pause();
        initialGrid = null;
        grid = [];
        rows = 0;
        cols = 0;
        generation = 0;
        clearError();
        resizeCanvas();
        render();
        updateStats();
        updateHash();
    }

    function updateHash() {
        const rle = gridToRLE(grid);
        history.replaceState(null, '', '#' + rle);
        rleDisplay.textContent = rle || '(empty)';
    }

    function updateStats() {
        let live = 0;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (grid[r][c]) live++;
            }
        }
        statsEl.textContent = 'Grid: ' + rows + '×' + cols + '  |  Gen: ' + generation + '  |  Live: ' + live;
    }

    function loadFromHash() {
        const hash = window.location.hash;
        const rleStr = hash.length > 1 ? hash.substring(1) : '';
        initialRLE = rleStr;

        if (rleStr === '') {
            // Default: glider
            initialRLE = 'o!2o!3o';
            initialGrid = parseRLE(initialRLE);
            grid = deepCopyGrid(initialGrid);
            rows = initialGrid.length;
            cols = initialGrid[0].length;
            generation = 0;
            clearError();
            resizeCanvas();
            render();
            updateStats();
            updateHash();
            return;
        }

        try {
            initialGrid = parseRLE(rleStr);
            grid = deepCopyGrid(initialGrid);
            rows = initialGrid.length;
            cols = initialGrid[0].length;
            generation = 0;
            clearError();
            resizeCanvas();
            render();
            updateStats();
        } catch (e) {
            showError('RLE parse error: ' + e.message);
            initialGrid = null;
            grid = [];
            rows = 0;
            cols = 0;
            resizeCanvas();
            render();
            updateStats();
        }
    }

    // Mouse interaction
    function getCellFromEvent(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;

        const cellSize = canvas.width / cols;
        const cellH = canvas.height / rows;

        const c = Math.floor((mx - GRID_BORDER) / cellSize);
        const r = Math.floor((my - GRID_BORDER) / cellH);

        if (r >= 0 && r < rows && c >= 0 && c < cols) {
            return [r, c];
        }
        return null;
    }

    canvas.addEventListener('click', function(e) {
        if (running) return;
        const cell = getCellFromEvent(e);
        if (!cell) return;
        const [r, c] = cell;
        grid[r][c] = !grid[r][c];
        render();
        updateStats();
        updateHash();
    });

    canvas.addEventListener('mousemove', function(e) {
        const cell = getCellFromEvent(e);
        hoverCell = cell;
        if (!running) render();
    });

    canvas.addEventListener('mouseleave', function() {
        hoverCell = null;
        if (!running) render();
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        switch (e.key) {
            case ' ':
                e.preventDefault();
                if (running) pause(); else start();
                break;
            case 's':
            case 'S':
                e.preventDefault();
                step();
                break;
            case 'r':
            case 'R':
                e.preventDefault();
                reset();
                break;
            case 'c':
            case 'C':
                e.preventDefault();
                clear();
                break;
        }
    });

    // Button events
    btnPlay.addEventListener('click', function() {
        if (running) pause(); else start();
    });

    btnStep.addEventListener('click', step);
    btnReset.addEventListener('click', reset);
    btnClear.addEventListener('click', clear);

    // Handle hash changes (for back/forward navigation)
    window.addEventListener('hashchange', function() {
        loadFromHash();
    });

    // Resize handler
    window.addEventListener('resize', function() {
        resizeCanvas();
        render();
    });

    // Initialize
    loadFromHash();
})();
</script>

</body>
</html>
