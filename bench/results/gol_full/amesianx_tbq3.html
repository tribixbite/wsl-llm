<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --accent-color: #4CAF50;
            --accent-hover: #45a049;
            --error-color: #ff5252;
            --border-color: #444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 1rem;
            text-align: center;
            width: 100%;
            background-color: var(--panel-bg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }

        h1 { margin: 0 0 0.5rem 0; font-size: 1.2rem; font-weight: 600; letter-spacing: 1px; }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        button {
            background-color: #444;
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        button:hover { background-color: #555; }
        button:active { background-color: #333; }

        button.primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        button.primary:hover { background-color: var(--accent-hover); }

        .status-bar {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            font-family: monospace;
            color: #aaa;
        }

        #main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        canvas {
            border: 1px solid var(--border-color);
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
            max-width: 100%;
            max-height: 80vh;
            image-rendering: pixelated; /* Keeps pixels sharp */
        }

        #error-message {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 82, 82, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            display: none;
            z-index: 20;
            text-align: center;
            max-width: 80%;
        }

        .info {
            font-size: 0.75rem;
            color: #777;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<header>
    <h1>GAME OF LIFE</h1>
    <div class="controls">
        <button id="btn-toggle" class="primary">Play</button>
        <button id="btn-step">Step</button>
        <button id="btn-reset">Reset</button>
        <button id="btn-clear">Clear</button>
    </div>
    <div class="status-bar">
        <span id="status-state">State: Paused</span>
        <span id="status-dim">Grid: 0x0</span>
        <span id="status-pop">Pop: 0</span>
    </div>
    <div class="info">
        Space: Play/Pause | S: Step | R: Reset | C: Clear | Click: Toggle
    </div>
</header>

<div id="error-message"></div>

<div id="main-container">
    <canvas id="gridCanvas"></canvas>
</div>

<script>
/**
 * Game of Life Implementation
 * 
 * Core Logic:
 * 1. Parse RLE from URL hash.
 * 2. Render to Canvas.
 * 3. Loop: Calculate next generation -> Update Canvas -> Update URL Hash.
 */

// --- Configuration ---
const CELL_SIZE = 10; // Size of one cell in pixels
const DEFAULT_RLE = "o$2o$o!"; // Simple blinker/glider variant if empty

// --- State ---
let grid = [];
let gridWidth = 0;
let gridHeight = 0;
let isRunning = false;
let animationId = null;
let lastTickTime = 0;
const TICK_RATE = 100; // ms per tick

// --- DOM Elements ---
const canvas = document.getElementById('gridCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const btnToggle = document.getElementById('btn-toggle');
const btnStep = document.getElementById('btn-step');
const btnReset = document.getElementById('btn-reset');
const btnClear = document.getElementById('btn-clear');
const elStatusState = document.getElementById('status-state');
const elStatusDim = document.getElementById('status-dim');
const elStatusPop = document.getElementById('status-pop');
const elError = document.getElementById('error-message');

// --- Initialization ---

function init() {
    // Setup Canvas Size
    canvas.width = window.innerWidth > 800 ? 800 : window.innerWidth - 40;
    canvas.height = window.innerHeight > 600 ? 600 : window.innerHeight - 150;
    
    // Load initial state
    loadFromHash();
    
    // Event Listeners
    window.addEventListener('resize', () => {
        // Debounce resize
        clearTimeout(window.resizeTimer);
        window.resizeTimer = setTimeout(() => {
            canvas.width = window.innerWidth > 800 ? 800 : window.innerWidth - 40;
            canvas.height = window.innerHeight > 600 ? 600 : window.innerHeight - 150;
            draw();
        }, 100);
    });

    window.addEventListener('keydown', handleKeydown);
    
    // Initial Render
    draw();
    updateStatusUI();
}

// --- RLE Parsing Logic ---

function parseRLE(rleString) {
    if (!rleString) return null;

    const rows = rleString.split('!');
    const newGrid = [];
    let maxCols = 0;

    for (let r = 0; r < rows.length; r++) {
        const rowStr = rows[r];
        const currentRow = [];
        let i = 0;
        
        while (i < rowStr.length) {
            const char = rowStr[i];
            
            // Parse Count (Digits)
            let count = 0;
            while (i < rowStr.length && rowStr[i] >= '0' && rowStr[i] <= '9') {
                count = (count * 10) + parseInt(rowStr[i], 10);
                i++;
            }

            // Parse Cell Type
            if (i >= rowStr.length) {
                throw new Error(`Unexpected end of RLE string at row ${r+1}. Missing cell character.`);
            }
            
            const type = rowStr[i];
            i++; // advance past char

            if (type !== 'o' && type !== 'b') {
                throw new Error(`Invalid cell character '${type}' at row ${r+1}, col ${currentRow.length}. Expected 'o' or 'b'.`);
            }

            // Default count is 1 if not specified
            if (count === 0) count = 1;

            // Fill row
            for (let c = 0; c < count; c++) {
                currentRow.push(type === 'o' ? 1 : 0);
            }
        }

        if (currentRow.length > 0) {
            newGrid.push(currentRow);
            if (currentRow.length > maxCols) maxCols = currentRow.length;
        }
    }

    if (newGrid.length === 0 || newGrid[0].length === 0) {
        return null; // Empty grid
    }

    // Normalize grid (pad shorter rows with 0s)
    for (let r = 0; r < newGrid.length; r++) {
        while (newGrid[r].length < maxCols) {
            newGrid[r].push(0);
        }
    }

    return {
        grid: newGrid,
        width: maxCols,
        height: newGrid.length
    };
}

function gridToRLE(grid) {
    if (!grid || grid.length === 0) return "";
    
    let rle = "";
    for (let r = 0; r < grid.length; r++) {
        const row = grid[r];
        let currentVal = -1;
        let count = 0;
        let rowRLE = "";

        for (let c = 0; c < row.length; c++) {
            const val = row[c];
            if (val === currentVal) {
                count++;
            } else {
                if (currentVal !== -1) {
                    rowRLE += count + String.fromCharCode(currentVal === 1 ? 111 : 98); // 111='o', 98='b'
                }
                currentVal = val;
                count = 1;
            }
        }
        if (currentVal !== -1) {
            rowRLE += count + String.fromCharCode(currentVal === 1 ? 111 : 98);
        }
        rle += rowRLE + "!";
    }
    return rle;
}

// --- Core Game Logic ---

function loadFromHash() {
    const hash = window.location.hash.substring(1);
    let rleString = hash || DEFAULT_RLE;
    
    try {
        const result = parseRLE(rleString);
        if (!result) {
            grid = [];
            gridWidth = 0;
            gridHeight = 0;
            showError("Empty grid parsed.");
        } else {
            grid = result.grid;
            gridWidth = result.width;
            gridHeight = result.height;
            hideError();
        }
    } catch (e) {
        showError("Invalid RLE in URL: " + e.message);
        // Fallback to empty or default to prevent crash
        grid = [];
        gridHeight = 0;
        gridWidth = 0;
    }
    
    // Update Canvas size to fit grid if grid is larger than window, 
    // or just keep canvas size and scale context if needed.
    // Here we keep canvas fixed size and draw grid centered or top-left.
    // The prompt asks for "Grid dimensions derived from RLE". 
    // We will draw the grid on the canvas. If grid > canvas, we might need to scroll or scale.
    // For simplicity in this self-contained file, we will scale the drawing if the grid is huge,
    // or just draw top-left.
    
    // Let's adjust cell size dynamically if grid is huge
    if (gridWidth > 0 && gridHeight > 0) {
        const maxW = Math.floor(canvas.width / gridWidth);
        const maxH = Math.floor(canvas.height / gridHeight);
        // Ensure cell is at least 1px, but prefer 10px
        const desiredSize = Math.min(maxW, maxH);
        
        // We store the desired cell size in a variable to use during draw
        canvas._cellSize = Math.max(1, desiredSize);
    } else {
        canvas._cellSize = CELL_SIZE;
    }
}

function nextGen() {
    if (gridHeight === 0) return;

    const newGrid = new Array(gridHeight);
    for (let r = 0; r < gridHeight; r++) {
        newGrid[r] = new Array(gridWidth).fill(0);
    }

    for (let r = 0; r < gridHeight; r++) {
        for (let c = 0; c < gridWidth; c++) {
            const neighbors = countNeighbors(r, c);
            const state = grid[r][c];

            if (state === 1) {
                if (neighbors < 2 || neighbors > 3) {
                    newGrid[r][c] = 0; // Dies
                } else {
                    newGrid[r][c] = 1; // Lives
                }
            } else {
                if (neighbors === 3) {
                    newGrid[r][c] = 1; // Born
                }
            }
        }
    }
    grid = newGrid;
}

function countNeighbors(r, c) {
    let count = 0;
    for (let i = -1; i <= 1; i++) {
        for (let j = -1; j <= 1; j++) {
            if (i === 0 && j === 0) continue;
            const nr = r + i;
            const nc = c + j;
            
            // Wrap around (Toroidal) logic? 
            // Standard Game of Life is infinite. 
            // For a fixed canvas/grid derived from RLE, boundaries are tricky.
            // Usually, out of bounds is dead (0).
            if (nr >= 0 && nr < gridHeight && nc >= 0 && nc < gridWidth) {
                count += grid[nr][nc];
            }
        }
    }
    return count;
}

// --- Rendering ---

function draw() {
    // Clear background
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gridWidth === 0 || gridHeight === 0) return;

    const cellSize = canvas._cellSize || CELL_SIZE;
    
    // Calculate draw scale/offset if grid is larger than canvas
    // To keep it simple: we draw top-left. If it overflows, it's clipped by canvas.
    // If user wants to see whole grid, they need to zoom (not implemented, but standard for simple apps).
    
    ctx.fillStyle = '#4CAF50'; // Live color
    ctx.strokeStyle = '#1a1a1a'; // Grid line color (background)

    for (let r = 0; r < gridHeight; r++) {
        for (let c = 0; c < gridWidth; c++) {
            if (grid[r][c] === 1) {
                // Draw cell
                ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                
                // Draw border for grid visibility
                ctx.strokeRect(c * cellSize, r * cellSize, cellSize, cellSize);
            }
        }
    }
}

function updateStatusUI() {
    elStatusState.textContent = `State: ${isRunning ? 'Running' : 'Paused'}`;
    elStatusDim.textContent = `Grid: ${gridWidth}x${gridHeight}`;
    
    let pop = 0;
    for(let r=0; r<gridHeight; r++) {
        for(let c=0; c<gridWidth; c++) {
            if(grid[r][c]) pop++;
        }
    }
    elStatusPop.textContent = `Pop: ${pop}`;
}

// --- Game Loop ---

function loop(timestamp) {
    if (!isRunning) return;

    if (timestamp - lastTickTime >= TICK_RATE) {
        nextGen();
        draw();
        updateStatusUI();
        
        // Update URL Hash
        // Use replaceState to avoid history stack explosion and hashchange loop
        const rle = gridToRLE(grid);
        history.replaceState(null, '', '#' + rle);
        
        lastTickTime = timestamp;
    }
    
    animationId = requestAnimationFrame(loop);
}

// --- Interaction Handlers ---

function togglePlay() {
    if (isRunning) {
        pause();
    } else {
        play();
    }
}

function play() {
    if (gridHeight === 0) return;
    isRunning = true;
    btnToggle.textContent = 'Pause';
    btnToggle.classList.remove('primary');
    lastTickTime = performance.now();
    loop(performance.now());
    updateStatusUI();
}

function pause() {
    isRunning = false;
    btnToggle.textContent = 'Play';
    btnToggle.classList.add('primary');
    if (animationId) cancelAnimationFrame(animationId);
    updateStatusUI();
}

function step() {
    pause();
    if (gridHeight > 0) {
        nextGen();
        draw();
        updateStatusUI();
        // Update URL to reflect the state after the step
        const rle = gridToRLE(grid);
        history.replaceState(null, '', '#' + rle);
    }
}

function reset() {
    pause();
    loadFromHash();
    draw();
    updateStatusUI();
}

function clearGrid() {
    pause();
    grid = [];
    gridWidth = 0;
    gridHeight = 0;
    canvas._cellSize = CELL_SIZE; // Reset cell size
    draw();
    updateStatusUI();
    // Clear URL
    history.replaceState(null, '', window.location.pathname);
}

function showError(msg) {
    elError.textContent = msg;
    elError.style.display = 'block';
    setTimeout(() => {
        if(elError.textContent === msg) elError.style.display = 'none';
    }, 5000);
}

function hideError() {
    elError.style.display = 'none';
}

function handleKeydown(e) {
    switch(e.key.toLowerCase()) {
        case ' ':
            e.preventDefault(); // Prevent scrolling
            togglePlay();
            break;
        case 's':
            step();
            break;
        case 'r':
            reset();
            break;
        case 'c':
            clearGrid();
            break;
    }
}

// --- Canvas Click Interaction ---

canvas.addEventListener('mousedown', (e) => {
    if (isRunning) return; // Disable interaction while running

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const cellSize = canvas._cellSize || CELL_SIZE;
    
    // Calculate grid coordinates
    const c = Math.floor(x / cellSize);
    const r = Math.floor(y / cellSize);

    if (r >= 0 && r < gridHeight && c >= 0 && c < gridWidth) {
        // Toggle cell
        grid[r][c] = grid[r][c] ? 0 : 1;
        
        // Update URL (since we modified state directly)
        const rle = gridToRLE(grid);
        history.replaceState(null, '', '#' + rle);
        
        draw();
        updateStatusUI();
    }
});

// --- Start ---
init();

</script>
</body>
</html>
