<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #4caf50;
            --grid-line: #333;
            --cell-live: #4caf50;
            --cell-dead: #1e1e1e;
            --panel-bg: #2d2d2d;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 10px 20px;
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid #444;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 1.2rem; }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        button:hover { background-color: #555; }
        button:active { background-color: #666; }
        button.primary { background-color: var(--accent-color); }
        button.primary:hover { background-color: #43a047; }

        .rle-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex-grow: 1;
            background-color: #111;
            border: 1px solid #444;
            color: #ddd;
            padding: 5px;
            border-radius: 4px;
            font-family: monospace;
        }

        .status-bar {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
        }

        .error-msg { color: #ff5252; }

        #canvas-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
        }

        canvas {
            display: block;
            background-color: var(--cell-dead);
        }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <h1>Conway's Game of Life (RLE)</h1>
        <div class="controls">
            <button id="btn-play" class="primary">Start</button>
            <button id="btn-step">Step</button>
            <button id="btn-reset">Reset</button>
            <button id="btn-clear">Clear</button>
        </div>
    </div>
    
    <div class="rle-container">
        <input type="text" id="rle-input" placeholder="Paste RLE here (e.g. 3o2b1o!2b3o)">
        <button id="btn-load">Load RLE</button>
    </div>

    <div class="status-bar">
        <span id="status-info">Ready</span>
        <span id="error-display"></span>
    </div>
</header>

<div id="canvas-container">
    <canvas id="game-canvas"></canvas>
</div>

<script>
/**
 * Game Logic and State Management
 */
const Game = (() => {
    // Configuration
    const CELL_SIZE = 10; // pixels per cell
    const FPS = 15;
    
    // State
    let grid = [];
    let rows = 0;
    let cols = 0;
    let isPlaying = false;
    let animationId = null;
    let lastTime = 0;
    let initialGrid = null; // To support Reset

    // DOM Elements
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const btnPlay = document.getElementById('btn-play');
    const btnStep = document.getElementById('btn-step');
    const btnReset = document.getElementById('btn-reset');
    const btnClear = document.getElementById('btn-clear');
    const btnLoad = document.getElementById('btn-load');
    const rleInput = document.getElementById('rle-input');
    const statusInfo = document.getElementById('status-info');
    const errorDisplay = document.getElementById('error-display');

    // --- RLE Parser ---
    function parseRLE(rleString) {
        if (!rleString) return null;
        
        // Remove comments (;) and whitespace, normalize case
        const clean = rleString.replace(/;/g, '').replace(/\s/g, '').toLowerCase();
        
        const tempRows = [];
        let currentRow = [];
        let count = 0;
        let expectingCount = true;

        for (let i = 0; i < clean.length; i++) {
            const char = clean[i];
            
            if (char >= '0' && char <= '9') {
                count = count * 10 + parseInt(char, 10);
                expectingCount = true;
            } else if (char === 'o' || char === 'b') {
                const repeat = expectingCount ? (count > 0 ? count : 1) : 1;
                // Only add if we are actually parsing a count or a bare char (count 0 implies 1 for bare)
                // If we had digits, count is set. If bare, count is 0, so we treat as 1.
                const actualCount = (count > 0) ? count : 1;
                
                for (let k = 0; k < actualCount; k++) {
                    currentRow.push(char === 'o' ? 1 : 0);
                }
                count = 0;
                expectingCount = false;
            } else if (char === '!') {
                if (currentRow.length > 0) {
                    tempRows.push(currentRow);
                    currentRow = [];
                }
                count = 0;
                expectingCount = true;
            }
            // Ignore other chars
        }
        
        // Push last row if not empty
        if (currentRow.length > 0) {
            tempRows.push(currentRow);
        }

        if (tempRows.length === 0) return null;

        // Calculate dimensions
        const r = tempRows.length;
        const c = Math.max(...tempRows.map(row => row.length));

        // Pad rows
        const finalGrid = tempRows.map(row => {
            while (row.length < c) row.push(0);
            return row;
        });

        return { grid: finalGrid, rows: r, cols: c };
    }

    // --- Grid Operations ---

    function createEmptyGrid(r, c) {
        return Array(r).fill().map(() => Array(c).fill(0));
    }

    function serializeRLE(g, r, c) {
        let str = "";
        for (let y = 0; y < r; y++) {
            let count = 0;
            let currentChar = 'b';
            for (let x = 0; x < c; x++) {
                const isLive = g[y][x] === 1;
                const char = isLive ? 'o' : 'b';
                
                if (char === currentChar) {
                    count++;
                } else {
                    if (count > 0) {
                        if (count > 1) str += count;
                        str += currentChar;
                    }
                    currentChar = char;
                    count = 1;
                }
            }
            // Flush last run
            if (count > 0) {
                if (count > 1) str += count;
                str += currentChar;
            }
            str += "!";
        }
        return str;
    }

    function updateURL() {
        const rle = serializeRLE(grid, rows, cols);
        history.replaceState(null, null, `#${rle}`);
    }

    // --- Core Game Loop ---

    function computeNextGen() {
        const nextGrid = createEmptyGrid(rows, cols);
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                let neighbors = 0;
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const ny = y + dy;
                        const nx = x + dx;
                        if (ny >= 0 && ny < rows && nx >= 0 && nx < cols) {
                            neighbors += grid[ny][nx];
                        }
                    }
                }
                
                const alive = grid[y][x];
                if (alive && (neighbors === 2 || neighbors === 3)) {
                    nextGrid[y][x] = 1;
                } else if (!alive && neighbors === 3) {
                    nextGrid[y][x] = 1;
                }
            }
        }
        return nextGrid;
    }

    function step() {
        if (!isPlaying) {
            grid = computeNextGen();
            draw();
            updateURL();
        }
    }

    function loop(timestamp) {
        if (!isPlaying) return;

        if (timestamp - lastTime > 1000 / FPS) {
            grid = computeNextGen();
            draw();
            updateURL();
            lastTime = timestamp;
        }
        animationId = requestAnimationFrame(loop);
    }

    // --- Rendering ---

    function resizeCanvas() {
        const container = document.getElementById('canvas-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        draw();
    }

    function draw() {
        ctx.fillStyle = '#1e1e1e'; // Dead color
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#4caf50'; // Live color
        
        // Optimization: only draw live cells
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                if (grid[y][x]) {
                    ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
                }
            }
        }
    }

    // --- Initialization & Events ---

    function loadFromHash() {
        const hash = window.location.hash.substring(1); // remove #
        if (!hash) {
            // Default pattern (Glider) if empty
            const defaultRLE = "2bo$b$o3b!";
            rleInput.value = defaultRLE;
            loadRLE(defaultRLE);
            return;
        }
        rleInput.value = hash;
        loadRLE(hash);
    }

    function loadRLE(str) {
        try {
            const parsed = parseRLE(str);
            if (!parsed) throw new Error("Empty or invalid RLE");
            
            grid = parsed.grid;
            rows = parsed.rows;
            cols = parsed.cols;
            initialGrid = JSON.parse(JSON.stringify(grid)); // Deep copy for reset
            
            errorDisplay.textContent = "";
            statusInfo.textContent = `Grid: ${cols}x${rows}`;
            
            // Resize canvas if grid is huge? For now, we assume it fits or scrolls.
            // Ideally we would implement a viewport camera, but sticking to requirements.
            // If grid is larger than screen, user scrolls the page (if overflow allowed) 
            // or we'd need a camera. The prompt implies simple canvas rendering.
            // We will set canvas size to fit window, but logic handles arbitrary grid size.
            // Note: Drawing a 1000x1000 grid on a small canvas without a camera will result in invisible cells.
            // To make it usable, let's ensure the canvas is at least as big as the grid, 
            // or allow CSS scrolling.
            
            // Force canvas to be large enough for the grid
            const minW = cols * CELL_SIZE;
            const minH = rows * CELL_SIZE;
            if (canvas.width < minW) canvas.width = minW;
            if (canvas.height < minH) canvas.height = minH;
            
            draw();
            updateURL();
        } catch (e) {
            errorDisplay.textContent = "Error: " + e.message;
            console.error(e);
        }
    }

    function start() {
        if (isPlaying) return;
        isPlaying = true;
        btnPlay.textContent = "Pause";
        btnPlay.classList.remove('primary'); // Visual toggle
        lastTime = performance.now();
        animationId = requestAnimationFrame(loop);
    }

    function pause() {
        isPlaying = false;
        btnPlay.textContent = "Start";
        btnPlay.classList.add('primary');
        if (animationId) cancelAnimationFrame(animationId);
    }

    function reset() {
        pause();
        if (initialGrid) {
            grid = JSON.parse(JSON.stringify(initialGrid));
            draw();
            updateURL();
        }
    }

    function clear() {
        pause();
        if (rows > 0 && cols > 0) {
            grid = createEmptyGrid(rows, cols);
            initialGrid = JSON.parse(JSON.stringify(grid));
            draw();
            updateURL();
        }
    }

    // --- Event Listeners ---

    btnPlay.addEventListener('click', () => isPlaying ? pause() : start());
    btnStep.addEventListener('click', () => { pause(); step(); });
    btnReset.addEventListener('click', reset);
    btnClear.addEventListener('click', clear);
    
    btnLoad.addEventListener('click', () => {
        pause();
        loadRLE(rleInput.value);
    });

    // Click to toggle
    canvas.addEventListener('mousedown', (e) => {
        if (isPlaying) return; // Only edit when paused
        
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) / CELL_SIZE);
        const y = Math.floor((e.clientY - rect.top) / CELL_SIZE);
        
        if (x >= 0 && x < cols && y >= 0 && y < rows) {
            grid[y][x] = grid[y][x] ? 0 : 1;
            draw();
            updateURL();
        }
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
        // Ignore if typing in input
        if (e.target.tagName === 'INPUT') return;

        switch(e.key.toLowerCase()) {
            case ' ':
                e.preventDefault();
                isPlaying ? pause() : start();
                break;
            case 's':
                pause();
                step();
                break;
            case 'r':
                reset();
                break;
            case 'c':
                clear();
                break;
        }
    });

    // Resize handling
    window.addEventListener('resize', resizeCanvas);

    // Initial Load
    resizeCanvas();
    loadFromHash();

})();
</script>

</body>
</html>
